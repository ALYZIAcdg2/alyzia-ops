name: Cabin — reconnaissance sources réelles (lot 1)

# Étape 2 de la vérification demandée par l'utilisateur : avant d'extraire un
# plan précis, on repère d'abord quelles pages de référence publiques
# existent réellement pour AH 73H / BJ 320 / SK 32N / AH 320 / EI 32Q (les
# plus utilisés dans les vols traités, cf. /api/cabin/coverage). Lecture
# seule, aucune écriture.
#
# V3 : SeatGuru redirige maintenant vers TripAdvisor et bloque (403) —
# abandonné. AeroLOPA utilise le code IATA 2 lettres comme slug de page
# (/ah, /ei...) — on va directement dessus. SeatMaps.com liste ses
# compagnies sous /airlines/<code-iata>-<nom>/ — on récupère l'index pour
# trouver le bon slug avant d'aller sur la page avion.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: AeroLOPA — pages compagnie par code IATA (/ah, /ei, /sk, /bj)
        run: |
          set +e
          for code in ah ei sk bj; do
            url="https://www.aerolopa.com/${code}"
            echo "===== AeroLOPA /${code} ====="
            final=$(curl -sS -L -o "ael_${code}.html" -w "%{url_effective} | HTTP %{http_code}" "$url" --max-time 20)
            echo "$final"
            echo "--- titre + liens avion (hrefs internes non génériques) ---"
            grep -oE '<title>[^<]*</title>' "ael_${code}.html" | head -1
            grep -oE 'href="/[a-z0-9-]+"' "ael_${code}.html" -i | sort -u | grep -viE '^href="/(about|contact|cookies|aircraft|airlines|app|favicon)' | head -40
            echo
          done

      - name: SeatMaps.com — index des compagnies (trouver le bon slug)
        run: |
          set +e
          curl -sS -L -o sm_index.html -w "%{url_effective} | HTTP %{http_code}\n" "https://seatmaps.com/airlines/" --max-time 20
          echo "--- slugs commençant par ah- / ei- / sk- / bj- ---"
          grep -oE 'href="/airlines/(ah|ei|sk|bj)-[a-z0-9-]+/"' sm_index.html -i | sort -u

      - name: SeatMaps.com — pages compagnie (slugs trouvés ci-dessus)
        run: |
          set +e
          SLUGS=$(grep -oE 'href="/airlines/(ah|ei|sk|bj)-[a-z0-9-]+/"' sm_index.html -i | sed -E 's/href="\/airlines\/(.+)\/"/\1/' | sort -u)
          echo "Slugs retenus: $SLUGS"
          for slug in $SLUGS; do
            url="https://seatmaps.com/airlines/${slug}/"
            echo "===== $url ====="
            final=$(curl -sS -L -o "sm_${slug}.html" -w "%{url_effective} | HTTP %{http_code}" "$url" --max-time 20)
            echo "$final"
            echo "--- liens avion (737/738/a320/a321/neo) ---"
            grep -oE 'href="[^"]*(737|738|a320|a321|neo)[^"]*"' "sm_${slug}.html" -i | sort -u | head -30
            echo
          done
