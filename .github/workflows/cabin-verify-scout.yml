name: Cabin — reconnaissance sources réelles (lot 1)

# Étape 5 : aucune balise <text> trouvée dans le HTML brut malgré 3 <svg> —
# la page est probablement une SPA (JS) qui charge le plan après coup via
# une API. On cherche des indices d'API (fetch/XHR vers un domaine ou
# chemin JSON) dans le HTML et les bundles JS référencés. Lecture seule.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspecte le HTML brut de la page AH-738 (début + indices d'API)
        run: |
          set +e
          curl -sS -L -o ah738.html "https://www.aerolopa.com/ah-738" --max-time 20
          echo "--- 3000 premiers caracteres ---"
          head -c 3000 ah738.html
          echo
          echo
          echo "--- balises <svg ...> avec leurs attributs (ouverture seulement) ---"
          grep -oE '<svg[^>]*>' ah738.html
          echo
          echo "--- scripts externes charges (src=) ---"
          grep -oE '<script[^>]*src="[^"]+"' ah738.html | sort -u
          echo
          echo "--- toute URL contenant api ou .json dans le HTML ---"
          grep -oE '"[a-zA-Z0-9_/.:-]*(api|\.json)[a-zA-Z0-9_/.:?=&-]*"' ah738.html | sort -u | head -30
