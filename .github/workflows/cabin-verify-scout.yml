name: Cabin — reconnaissance sources réelles (lot 1)

# Étape 4 : les pages AeroLOPA embarquent le plan en SVG (3 balises <svg>
# par page). On extrait les éléments <text> (numéros de rangée, lettres de
# siège, repères sortie/galley/toilette) pour reconstruire la géométrie
# réelle sans avoir à interpréter une image. Lecture seule.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extrait les libellés texte des SVG (rangées, sièges, repères)
        run: |
          set +e
          declare -A PAGES=(
            ["AH738"]="https://www.aerolopa.com/ah-738"
            ["SK32N"]="https://www.aerolopa.com/sk-32n"
            ["EI32Q1"]="https://www.aerolopa.com/ei-32q-1"
            ["EI32Q2"]="https://www.aerolopa.com/ei-32q-2"
          )
          for name in "${!PAGES[@]}"; do
            url="${PAGES[$name]}"
            file="page_${name}.html"
            echo "===== $name : $url ====="
            curl -sS -L -o "$file" "$url" --max-time 20
            echo "--- nb de balises <text> ---"
            grep -oc '<text' "$file"
            echo "--- contenu de tous les <text>...</text> (dans l'ordre du document) ---"
            grep -oE '<text[^>]*>[^<]*</text>' "$file" | sed -E 's/<text[^>]*>//; s/<\/text>//' | tr '\n' '|'
            echo
            echo
          done

      - name: Upload pages complètes (secours si le texte SVG ne suffit pas)
        uses: actions/upload-artifact@v4
        with:
          name: cabin-scout-svg-pages
          path: page_*.html
          retention-days: 3
