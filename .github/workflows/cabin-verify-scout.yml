name: Cabin — reconnaissance sources réelles (lot 1)

# Étape 7 : le plan AeroLOPA est une image statique (CloudFront), pas une
# donnée exploitable en texte — imprimer son base64 dans les logs CI a
# atteint la limite de troncature des logs. On la récupère à la place via
# un commit sur une branche jetable (cabin-scout-assets), que l'agent
# récupère ensuite par git fetch pour l'examiner visuellement — sans risque
# de troncature. La branche est supprimée une fois l'examen terminé.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Récupère les images seatmap réelles (AeroLOPA + SeatMaps.com)
        run: |
          set +e
          mkdir -p scout_assets
          echo "--- AeroLOPA AH-738 (AH 73H) ---"
          curl -sS -o scout_assets/ah-738.webp "https://d9k46j35fmriq.cloudfront.net/maptool/seatmaps/ah-738.webp" --max-time 20
          echo "--- AeroLOPA SK-32N (SK 32N) ---"
          curl -sS -o scout_assets/sk-32n.webp "https://d9k46j35fmriq.cloudfront.net/maptool/seatmaps/sk-32n.webp" --max-time 20
          echo "--- AeroLOPA EI-32Q-1 (EI 32Q variante 1) ---"
          curl -sS -o scout_assets/ei-32q-1.webp "https://d9k46j35fmriq.cloudfront.net/maptool/seatmaps/ei-32q-1.webp" --max-time 20
          echo "--- AeroLOPA EI-32Q-2 (EI 32Q variante 2) ---"
          curl -sS -o scout_assets/ei-32q-2.webp "https://d9k46j35fmriq.cloudfront.net/maptool/seatmaps/ei-32q-2.webp" --max-time 20

          echo "--- SeatMaps.com BJ Nouvelair A320 : repère l'URL de l'image ---"
          curl -sS -L -o bj_page.html "https://seatmaps.com/airlines/bj-nouvelair/airbus-a320/" --max-time 20
          grep -oE '<img[^>]*src="[^"]+"' bj_page.html -i | sort -u | head -20

          echo "--- tailles récupérées ---"
          ls -la scout_assets/
          file scout_assets/*

      - name: Convertit les webp en png (plus simple à visualiser)
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq webp
          for f in scout_assets/*.webp; do
            [ -f "$f" ] || continue
            dwebp "$f" -o "${f%.webp}.png" 2>&1
          done
          rm -f scout_assets/*.webp
          ls -la scout_assets/

      - name: Publie sur une branche jetable pour examen par l'agent
        run: |
          git config user.name "cabin-scout-bot"
          git config user.email "cabin-scout-bot@users.noreply.github.com"
          git checkout -B cabin-scout-assets
          git add scout_assets bj_page.html
          git commit -m "Images seatmap réelles récupérées pour vérification (branche jetable, à supprimer après usage)"
          git push -f origin cabin-scout-assets
