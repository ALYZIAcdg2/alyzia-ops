name: Nettoyage — supprime le worker Cloudflare alyzia-ops-v2

# Déclenchement manuel uniquement : le projet v2 (reconstruction complète
# de ALYZIA OPS) a été abandonné, on reste sur le worker de production
# "alyzia-ops". Ce workflow supprime le worker de test "alyzia-ops-v2"
# déployé pendant la construction, pour ne rien laisser tourner
# inutilement sur Cloudflare.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Supprime le worker alyzia-ops-v2
        run: npx wrangler delete --name alyzia-ops-v2 --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
