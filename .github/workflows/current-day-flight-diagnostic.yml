name: Diagnostic vols du jour

on:
  push:
    paths:
      - '.github/workflows/current-day-flight-diagnostic.yml'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Controle vols passes H-1 et STA
        run: |
          DATE=$(TZ=Europe/Paris date +%F)
          NOW=$(TZ=Europe/Paris date +%H:%M)
          curl -sS -f "$API/api/flights" -o flights.json
          node - "$DATE" "$NOW" > flight-audit.txt <<'NODE'
          const fs=require('fs');
          const date=process.argv[2], now=process.argv[3];
          const j=JSON.parse(fs.readFileSync('flights.json','utf8'));
          const flights=(j.flights||[]).filter(f=>String(f.date||'')===date).sort((a,b)=>String(a.std||'').localeCompare(String(b.std||'')));
          const min=t=>{const m=String(t||'').match(/^(\d{2}):(\d{2})$/);return m?Number(m[1])*60+Number(m[2]):null};
          const nowm=min(now), plus60=nowm+60;
          const val=v=>String(v||'').trim();
          const status=f=>val(f.opsStatus||f.status||f.flight_status||f.providerStatusRaw)||'-';
          const missingKeys=f=>[['STA',f.sta],['ETD',f.etd||f.edt],['ATD',f.atd],['ETA',f.eta],['ATA',f.ata],['REG',f.reg],['GATE',f.gate]].filter(([,v])=>!val(v)).map(([k])=>k);
          const past=flights.filter(f=>{const s=min(f.std);return s!==null&&s<nowm&&!val(f.atd)&&!/CANCEL|ANNUL/i.test(status(f));});
          const h1=flights.filter(f=>{const s=min(f.std);return s!==null&&s>=nowm&&s<=plus60&&missingKeys(f).length>0;});
          const restSta=flights.filter(f=>{const s=min(f.std);return s!==null&&s>=nowm&&!val(f.sta);});
          const tomorrowDate=new Date(date+'T12:00:00Z');tomorrowDate.setUTCDate(tomorrowDate.getUTCDate()+1);const tomorrow=tomorrowDate.toISOString().slice(0,10);
          const tomorrowFlights=(j.flights||[]).filter(f=>String(f.date||'')===tomorrow).sort((a,b)=>String(a.std||'').localeCompare(String(b.std||'')));
          const tomorrowSta=tomorrowFlights.filter(f=>!val(f.sta));
          const line=f=>[val(f.std)||'-',val(f.flight||f.flight_number)||'-',val(f.destination||f.dest)||'-',status(f),val(f.sta)||'-',val(f.etd||f.edt)||'-',val(f.atd)||'-',val(f.eta)||'-',val(f.ata)||'-',val(f.reg)||'-',val(f.gate)||'-',missingKeys(f).join(',')||'-'].join('|');
          console.log(`DATE ${date} NOW ${now} TOTAL ${flights.length}`);
          console.log(`PAST_NO_ATD ${past.length}`); console.log('STD|VOL|DEST|STATUS|STA|ETD|ATD|ETA|ATA|REG|GATE|MISSING'); past.forEach(f=>console.log(line(f)));
          console.log(`H1_INCOMPLETE ${h1.length}`); console.log('STD|VOL|DEST|STATUS|STA|ETD|ATD|ETA|ATA|REG|GATE|MISSING'); h1.forEach(f=>console.log(line(f)));
          console.log(`REST_TODAY_STA_MISSING ${restSta.length}`); restSta.forEach(f=>console.log([val(f.std)||'-',val(f.flight||f.flight_number)||'-',val(f.destination||f.dest)||'-'].join('|')));
          console.log(`TOMORROW ${tomorrow} TOTAL ${tomorrowFlights.length} STA_MISSING ${tomorrowSta.length}`); tomorrowSta.forEach(f=>console.log([val(f.std)||'-',val(f.flight||f.flight_number)||'-',val(f.destination||f.dest)||'-'].join('|')));
          NODE
          cat flight-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: flight-audit
          path: flight-audit.txt
          retention-days: 1

# refresh 2026-09-27 17:10 Europe/Paris
