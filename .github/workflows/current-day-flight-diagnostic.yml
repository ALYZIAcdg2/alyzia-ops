name: Diagnostic vols du jour

on:
  push:
    paths:
      - '.github/workflows/current-day-flight-diagnostic.yml'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Vérifie les vols du jour en production
        run: |
          DATE=$(TZ=Europe/Paris date +%F)
          echo "Date Paris: $DATE"
          curl -sS -f "$API/api/flights" -o flights.json
          node - "$DATE" <<'NODE'
          const fs=require('fs');
          const date=process.argv[2];
          const j=JSON.parse(fs.readFileSync('flights.json','utf8'));
          const all=Array.isArray(j.flights)?j.flights:[];
          const today=all.filter(f=>String(f.date||'')===date).sort((a,b)=>String(a.std||'').localeCompare(String(b.std||''))||String(a.flight||'').localeCompare(String(b.flight||'')));
          console.log('TOTAL_BASE',j.count);
          console.log('TOTAL_TODAY',today.length);
          console.log('AFTER_1000',today.filter(f=>String(f.std||'')>'10:00').length);
          console.log('AFTER_1200',today.filter(f=>String(f.std||'')>='12:00').length);
          console.log('FIRST', today[0] ? `${today[0].std} ${today[0].flight}` : 'NONE');
          console.log('LAST', today.length ? `${today[today.length-1].std} ${today[today.length-1].flight}` : 'NONE');
          NODE
      - name: Cherche le filtrage de la liste dans le frontend
        run: |
          echo '--- fonctions / filtres candidats ---'
          grep -Eni "render.*flight|flight.*render|filtered.*flight|visible.*flight|today.*flight|current.*time|now.*min|std.*min|FLIGHTS.*filter|filter\(.*std|flight-list|flightlist" public/index.html | head -n 320 || true
          echo '--- fetch API vols ---'
          grep -Eni "api/flights|server.*flights|load.*flights|sync.*flights" public/index.html | head -n 220 || true
