name: Diagnostic vols du jour

on:
  push:
    paths:
      - '.github/workflows/current-day-flight-diagnostic.yml'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Vérifie couverture OAG du jour
        run: |
          DATE=$(TZ=Europe/Paris date +%F)
          curl -sS -f "$API/api/flights" -o flights.json
          node - "$DATE" > oag-day.txt <<'NODE'
          const fs=require('fs'); const date=process.argv[2]; const j=JSON.parse(fs.readFileSync('flights.json','utf8'));
          const today=(j.flights||[]).filter(f=>String(f.date||'')===date).sort((a,b)=>String(a.std||'').localeCompare(String(b.std||'')));
          const yes=v=>String(v||'').trim()?String(v).trim():'-';
          console.log('DATE',date,'TOTAL',today.length,'AFTER_1000',today.filter(f=>String(f.std||'')>'10:00').length);
          console.log('STD|VOL|STA|ETD|ATD|ETA|ATA|REG|OAG_CHECK|OAG_STATUS');
          for(const f of today) console.log([yes(f.std),yes(f.flight),yes(f.sta),yes(f.etd||f.edt),yes(f.atd),yes(f.eta),yes(f.ata),yes(f.reg),yes(f.oagLastCheckedAt||f.oagSafeCheckedAt),yes(f.oagLastStatus||f.oagSafeStatus)].join('|'));
          console.log('CHECKED_OAG',today.filter(f=>f.oagLastCheckedAt||f.oagSafeCheckedAt).length);
          console.log('CHECKED_AFTER_1000',today.filter(f=>String(f.std||'')>'10:00'&&(f.oagLastCheckedAt||f.oagSafeCheckedAt)).length);
          console.log('WITH_STA_AFTER_1000',today.filter(f=>String(f.std||'')>'10:00'&&String(f.sta||'').trim()).length);
          console.log('WITH_OPS_AFTER_1000',today.filter(f=>String(f.std||'')>'10:00'&&[f.etd,f.edt,f.atd,f.eta,f.ata].some(x=>String(x||'').trim())).length);
          NODE
          cat oag-day.txt
      - uses: actions/upload-artifact@v4
        with:
          name: flight-diagnostic
          path: oag-day.txt
          retention-days: 1
