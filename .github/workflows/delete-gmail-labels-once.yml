name: Relevé Gmail lecture seule — SQ

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - name: Relevé SQ (60 messages)
        run: |
          curl -sS -f "$BASE/api/autopilot/dry-list-survey?query=in%3Aanywhere%20SQ&maxMessages=60&airline=SQ"
          echo
