      - name: "7/9 IZ742 INFT (1a0727f8f559cee8)"
        continue-on-error: true
        run: |
          curl -sS --max-time 60 -X POST "$BASE/api/autopilot/test-batch" -H "Content-Type: application/json" -d '{"messageIds":["1a0727f8f559cee8"]}' -o /tmp/r7.json
          echo "exit=$?"; cat /tmp/r7.json 2>/dev/null || echo "(vide)"
      - name: "8/9 IZ742 Children (1a0727f195a98276)"
        continue-on-error: true
        run: |
          curl -sS --max-time 60 -X POST "$BASE/api/autopilot/test-batch" -H "Content-Type: application/json" -d '{"messageIds":["1a0727f195a98276"]}' -o /tmp/r8.json
