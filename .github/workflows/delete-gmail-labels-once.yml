name: Relevé Gmail lecture seule — TK CHECK IN INFORMATION complet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - name: Relevé TK (30 messages, aperçu élargi)
        run: |
          curl -sS -f --max-time 120 "$BASE/api/autopilot/dry-list-survey?query=in%3Aanywhere&maxMessages=30&airline=TK" -o /tmp/survey.json || true
      - name: Affiche toutes les listes TK avec aperçu texte complet
        run: |
          file=/tmp/survey.json
          if [ ! -s "$file" ]; then echo "(pas de fichier / erreur curl)"; exit 0; fi
          node -e '
            let j;
            try{ j=JSON.parse(require("fs").readFileSync("/tmp/survey.json","utf8")); }catch(e){ console.log("JSON invalide:",e.message); process.exit(0); }
            console.log(JSON.stringify({messagesFound:j.messagesFound,messagesChecked:j.messagesChecked,documentsSeen:j.documentsSeen,errors:(j.errors||[]).length}));
            const co=(j.companies||[]).find(c=>c.airline==="TK");
            const lists=co?co.lists:[];
            for(const l of lists){
              console.log(JSON.stringify({listName:l.listName,cardKey:l.cardKey,occurrences:l.occurrences,samplePassengerCount:l.samplePassengerCount}));
            }
            console.log("---- aperçu texte complet (toutes cartes TK) ----");
            for(const l of lists){
              if(l.textPreview){
                console.log("--- "+l.listName+" ("+l.cardKey+") ---");
                console.log(l.textPreview);
              }
            }
          '
