name: Relevé Gmail lecture seule — IZ744/IZ742 contenu brut (diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - name: Relevé brut IZ744/IZ742 (sujet + aperçu corps, sans détection)
        run: |
          curl -sS -f --max-time 150 "$BASE/api/autopilot/dry-raw-message-dump?query=IZ744%20OR%20IZ742&maxMessages=20" -o /tmp/survey.json || true
      - name: Affiche le contenu brut
        run: |
          file=/tmp/survey.json
          if [ ! -s "$file" ]; then echo "(pas de fichier / erreur curl)"; exit 0; fi
          cat "$file"
