name: Relevé Gmail lecture seule — KID mixte DE/TU/SB/RJ

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - name: Relevé DE (Condor)
        run: |
          curl -sS -f "$BASE/api/autopilot/dry-list-survey?query=in%3Aanywhere&maxMessages=100&airline=DE" -o /tmp/survey_de.json || true
      - name: Relevé TU (Tunisair)
        run: |
          curl -sS -f "$BASE/api/autopilot/dry-list-survey?query=in%3Aanywhere&maxMessages=100&airline=TU" -o /tmp/survey_tu.json || true
      - name: Relevé SB (Aircalin)
        run: |
          curl -sS -f "$BASE/api/autopilot/dry-list-survey?query=in%3Aanywhere&maxMessages=100&airline=SB" -o /tmp/survey_sb.json || true
      - name: Relevé RJ (Royal Jordanian)
        run: |
          curl -sS -f "$BASE/api/autopilot/dry-list-survey?query=in%3Aanywhere&maxMessages=100&airline=RJ" -o /tmp/survey_rj.json || true
      - name: Affiche les listes KID/CHLD/INF de chaque compagnie
        run: |
          for pair in "DE:/tmp/survey_de.json" "TU:/tmp/survey_tu.json" "SB:/tmp/survey_sb.json" "RJ:/tmp/survey_rj.json"; do
            code="${pair%%:*}"
            file="${pair#*:}"
            echo "======== $code ========"
            if [ ! -s "$file" ]; then echo "(pas de fichier / erreur curl)"; continue; fi
            node -e '
              const code=process.argv[1];
              const file=process.argv[2];
              let j;
              try{ j=JSON.parse(require("fs").readFileSync(file,"utf8")); }catch(e){ console.log("JSON invalide:",e.message); process.exit(0); }
              console.log(JSON.stringify({messagesFound:j.messagesFound,messagesChecked:j.messagesChecked,documentsSeen:j.documentsSeen,errors:(j.errors||[]).length}));
              const co=(j.companies||[]).find(c=>c.airline===code);
              const lists=co?co.lists:[];
              for(const l of lists){
                console.log(JSON.stringify({listName:l.listName,cardKey:l.cardKey,occurrences:l.occurrences,samplePassengerCount:l.samplePassengerCount}));
              }
              console.log("---- aperçu texte (listes KID/CHLD/CHILD/INF/INFANT/INFKID) ----");
              for(const l of lists){
                const ln=String(l.listName||"").toUpperCase();
                if(/KID|CHLD|CHILD|INF/.test(ln) && l.textPreview){
                  console.log("--- "+l.listName+" ("+l.cardKey+") ---");
                  console.log(l.textPreview);
                }
              }
            ' "$code" "$file"
            echo
          done
