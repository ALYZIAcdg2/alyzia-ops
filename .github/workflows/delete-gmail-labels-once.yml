name: Relevé Gmail lecture seule — vérification correctif DU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - name: Relevé "prepa du" (query ciblée)
        run: |
          curl -sS -f "$BASE/api/autopilot/dry-list-survey?query=in%3Aanywhere%20subject%3A%22prepa%20du%22&maxMessages=20"
          echo
