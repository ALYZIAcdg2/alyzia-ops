name: Relevé Gmail lecture seule — WB (booked) et IZ744/IZ742 6SEP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey-wb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - name: Relevé WB (ALL CUSTOMERS, aperçu élargi)
        run: |
          curl -sS -f --max-time 150 "$BASE/api/autopilot/dry-list-survey?query=in%3Aanywhere&maxMessages=100&airline=WB" -o /tmp/survey_wb.json || true
      - name: Affiche WB
        run: |
          file=/tmp/survey_wb.json
          echo "======== WB ========"
          if [ ! -s "$file" ]; then echo "(pas de fichier / erreur curl)"; exit 0; fi
          node -e '
            let j;
            try{ j=JSON.parse(require("fs").readFileSync("/tmp/survey_wb.json","utf8")); }catch(e){ console.log("JSON invalide:",e.message); process.exit(0); }
            console.log(JSON.stringify({messagesFound:j.messagesFound,messagesChecked:j.messagesChecked,documentsSeen:j.documentsSeen,errors:(j.errors||[]).length}));
            const co=(j.companies||[]).find(c=>c.airline==="WB");
            const lists=co?co.lists:[];
            for(const l of lists){
              console.log(JSON.stringify({listName:l.listName,cardKey:l.cardKey,occurrences:l.occurrences,samplePassengerCount:l.samplePassengerCount}));
            }
            console.log("---- aperçu texte complet ----");
            for(const l of lists){
              if(l.textPreview){
                console.log("--- "+l.listName+" ("+l.cardKey+") ---");
                console.log(l.textPreview);
              }
            }
          '

  survey-iz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - name: Relevé IZ744/IZ742 6SEP (recherche ciblée)
        run: |
          curl -sS -f --max-time 150 "$BASE/api/autopilot/dry-list-survey?query=IZ744%20OR%20IZ742&maxMessages=50&airline=IZ" -o /tmp/survey_iz.json || true
      - name: Affiche IZ
        run: |
          file=/tmp/survey_iz.json
          echo "======== IZ ========"
          if [ ! -s "$file" ]; then echo "(pas de fichier / erreur curl)"; exit 0; fi
          node -e '
            let j;
            try{ j=JSON.parse(require("fs").readFileSync("/tmp/survey_iz.json","utf8")); }catch(e){ console.log("JSON invalide:",e.message); process.exit(0); }
            console.log(JSON.stringify({messagesFound:j.messagesFound,messagesChecked:j.messagesChecked,documentsSeen:j.documentsSeen,errors:(j.errors||[]).length}));
            const co=(j.companies||[]).find(c=>c.airline==="IZ");
            const lists=co?co.lists:[];
            for(const l of lists){
              console.log(JSON.stringify({listName:l.listName,cardKey:l.cardKey,occurrences:l.occurrences,samplePassengerCount:l.samplePassengerCount}));
            }
            console.log("---- aperçu texte complet ----");
            for(const l of lists){
              if(l.textPreview){
                console.log("--- "+l.listName+" ("+l.cardKey+") ---");
                console.log(l.textPreview);
              }
            }
          '
