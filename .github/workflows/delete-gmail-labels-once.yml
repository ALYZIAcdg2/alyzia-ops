          curl -sS --max-time 90 -X POST "$BASE/api/autopilot/test-batch" -H "Content-Type: application/json" -d '{"messageIds":["1a0727eed62e5b73"]}' -o /tmp/r9.json
          echo "exit=$?"; cat /tmp/r9.json 2>/dev/null || echo "(vide)"
      - name: Fiche vol IZ744 06SEP 2026 après import
        run: |
          curl -sS -f --max-time 60 -G "$BASE/api/autopilot/flight-summary" --data-urlencode "identity=2026-09-06|IZ|IZ744" -o /tmp/iz744.json || true
          echo "=== IZ744 APRÈS IMPORT ==="
          cat /tmp/iz744.json 2>/dev/null || echo "(vide)"
      - name: Fiche vol IZ742 06SEP 2026 après import
        run: |
          curl -sS -f --max-time 60 -G "$BASE/api/autopilot/flight-summary" --data-urlencode "identity=2026-09-06|IZ|IZ742" -o /tmp/iz742.json || true
          echo "=== IZ742 APRÈS IMPORT ==="
