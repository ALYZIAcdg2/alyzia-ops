name: Relevé Gmail lecture seule — SB501 aperçu élargi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - name: Relevé SB (10 messages les plus récents, filtré compagnie, aperçu élargi)
        run: |
          curl -sS -f "$BASE/api/autopilot/dry-list-survey?query=in%3Aanywhere&maxMessages=10&airline=SB" -o /tmp/survey_sb.json
          echo "== SB : toutes les listes =="
          node -e '
            const j=JSON.parse(require("fs").readFileSync("/tmp/survey_sb.json","utf8"));
            console.log(JSON.stringify({messagesFound:j.messagesFound,messagesChecked:j.messagesChecked,documentsSeen:j.documentsSeen,errors:(j.errors||[]).length}));
            const sb=(j.companies||[]).find(c=>c.airline==="SB");
            const lists=sb?sb.lists:[];
            for(const l of lists){
              console.log(JSON.stringify({listName:l.listName,cardKey:l.cardKey,occurrences:l.occurrences,samplePassengerCount:l.samplePassengerCount}));
            }
            console.log("== SB : aperçu texte complet (toutes cartes) ==");
            for(const l of lists){
              if(l.textPreview){
                console.log("--- "+l.listName+" ("+l.cardKey+") ---");
                console.log(l.textPreview);
              }
            }
          '
          echo
