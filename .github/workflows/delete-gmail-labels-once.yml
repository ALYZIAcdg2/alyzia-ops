      - name: "5/9 IZ742 PIL SSR full name (1a0728196a204085)"
        continue-on-error: true
        run: |
          curl -sS --max-time 60 -X POST "$BASE/api/autopilot/test-batch" -H "Content-Type: application/json" -d '{"messageIds":["1a0728196a204085"]}' -o /tmp/r5.json
          echo "exit=$?"; cat /tmp/r5.json 2>/dev/null || echo "(vide)"
      - name: "6/9 IZ742 Web checkin (1a0727ffb96ce063)"
        continue-on-error: true
