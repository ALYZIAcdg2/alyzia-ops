name: Récupère l'URL d'autorisation Google Drive (une fois)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get_url:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BASE: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - name: POST /api/prepa/google-drive/oauth/start
        run: |
          curl -sS -X POST "$BASE/api/prepa/google-drive/oauth/start" -H "Content-Type: application/json"
          echo
