name: Import ciblé test — IZ744/IZ742 06SEP (un par un)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - name: "1/9 IZ744 INFT (1a07282cef9fe4cb)"
        continue-on-error: true
        run: |
          curl -sS --max-time 60 -X POST "$BASE/api/autopilot/test-batch" -H "Content-Type: application/json" -d '{"messageIds":["1a07282cef9fe4cb"]}' -o /tmp/r1.json
          echo "exit=$?"; cat /tmp/r1.json 2>/dev/null || echo "(vide)"
      - name: "2/9 IZ744 Children (1a07282ce6ad65c7)"
        continue-on-error: true
        run: |
          curl -sS --max-time 60 -X POST "$BASE/api/autopilot/test-batch" -H "Content-Type: application/json" -d '{"messageIds":["1a07282ce6ad65c7"]}' -o /tmp/r2.json
          echo "exit=$?"; cat /tmp/r2.json 2>/dev/null || echo "(vide)"
      - name: "3/9 IZ744 All passengers (1a072825eae203dc)"
        continue-on-error: true
        run: |
          curl -sS --max-time 90 -X POST "$BASE/api/autopilot/test-batch" -H "Content-Type: application/json" -d '{"messageIds":["1a072825eae203dc"]}' -o /tmp/r3.json
          echo "exit=$?"; cat /tmp/r3.json 2>/dev/null || echo "(vide)"
      - name: "4/9 IZ742 PIL SSR (1a072819e4156c91)"
