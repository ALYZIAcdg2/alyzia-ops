name: Vérif intermédiaire IZ744/IZ742 (sans toucher à l'import en cours)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - name: Fiche vol IZ744
        run: |
          curl -sS -f --max-time 30 -G "$BASE/api/autopilot/flight-summary" --data-urlencode "identity=2026-09-06|IZ|IZ744" -o /tmp/iz744.json || true
          echo "=== IZ744 ==="; cat /tmp/iz744.json 2>/dev/null || echo "(vide)"
      - name: Fiche vol IZ742
        run: |
          curl -sS -f --max-time 30 -G "$BASE/api/autopilot/flight-summary" --data-urlencode "identity=2026-09-06|IZ|IZ742" -o /tmp/iz742.json || true
          echo "=== IZ742 ==="; cat /tmp/iz742.json 2>/dev/null || echo "(vide)"
      - name: Statut autopilot (jobs en attente)
        run: |
          curl -sS --max-time 30 "$BASE/api/autopilot/status" -o /tmp/s.json || true
          echo "=== STATUS ==="; cat /tmp/s.json 2>/dev/null || echo "(vide)"
