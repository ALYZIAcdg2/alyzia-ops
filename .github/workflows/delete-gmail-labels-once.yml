name: Diagnostic — champs réels du vol IZ742 (pastille verte)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - name: Récupère /api/flights et isole IZ742
        run: |
          curl -sS --max-time 30 "$BASE/api/flights" -o /tmp/flights.json
          node -e '
            const j=JSON.parse(require("fs").readFileSync("/tmp/flights.json","utf8"));
            const list=Array.isArray(j)?j:(j.flights||j.items||[]);
            const matches=list.filter(f=>String(f.flight||"").toUpperCase()==="IZ742");
            console.log("Occurrences IZ742 trouvées:", matches.map(m=>m.date));
            const x=matches.find(f=>String(f.date||"")==="2026-09-06")||matches[0];
            if(!x){console.log("IZ742 INTROUVABLE. Total vols:",list.length); process.exit(0);}
            const {passengers,common_lists,imports,...rest}=x;
            console.log(JSON.stringify(rest,null,2));
            console.log("imports.cards keys:", imports&&imports.cards?Object.keys(imports.cards):"(aucun)");
          '
