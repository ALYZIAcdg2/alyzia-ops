name: Vérification Drive + Gmail (lecture, sans relancer le traitement)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - name: Statut Google Drive
        run: |
          curl -sS -f "$BASE/api/prepa/google-drive/status"
          echo

      - name: Statut Gmail
        run: |
          curl -sS -f "$BASE/api/gmail/status"
          echo

      - name: Statut AUTO PILOT (config + dernier run)
        run: |
          curl -sS -f "$BASE/api/autopilot/status"
          echo
