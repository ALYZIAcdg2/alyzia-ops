name: Relevé Gmail lecture seule — vérification de toutes les compagnies

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - name: Relevé complet (100 messages, toutes compagnies)
        run: |
          curl -sS -f "$BASE/api/autopilot/dry-list-survey?query=in%3Aanywhere&maxMessages=100" -o /tmp/survey.json
          echo "== Résumé global =="
          node -e '
            const j=JSON.parse(require("fs").readFileSync("/tmp/survey.json","utf8"));
            console.log(JSON.stringify({messagesFound:j.messagesFound,messagesChecked:j.messagesChecked,documentsSeen:j.documentsSeen,errors:(j.errors||[]).length}));
            for(const c of (j.companies||[])){
              console.log("");
              console.log("###### "+c.airline+" ("+c.lists.length+" listes distinctes) ######");
              for(const l of c.lists){
                console.log(JSON.stringify({listName:l.listName,cardKey:l.cardKey,mappingScope:l.mappingScope,occurrences:l.occurrences,samplePassengerCount:l.samplePassengerCount}));
              }
            }
            console.log("");
            console.log("== TOUTES les listes OTHER (à examiner en priorité) ==");
            for(const c of (j.companies||[])){
              for(const l of c.lists){
                if(l.cardKey==="OTHER"){
                  console.log(JSON.stringify({airline:c.airline,listName:l.listName,occurrences:l.occurrences,samplePassengerCount:l.samplePassengerCount,textPreview:(l.textPreview||"").slice(0,300)}));
                }
              }
            }
            if((j.errors||[]).length){
              console.log("== Erreurs ==");
              for(const e of j.errors.slice(0,20)) console.log(JSON.stringify(e));
            }
          '
          echo
