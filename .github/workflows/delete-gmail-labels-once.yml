name: Diagnostic — pourquoi le POST test-batch bloque

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - name: POST test-batch 1 message avec timeout dur + verbose
        run: |
          echo "Début: $(date -u +%H:%M:%S)"
          timeout 70 curl -v --max-time 60 -X POST "$BASE/api/autopilot/test-batch" \
            -H "Content-Type: application/json" \
            -d '{"messageIds":["1a07282cef9fe4cb"]}' \
            -o /tmp/r1.json 2>&1 | tail -60
          echo "exit=$?"
          echo "Fin: $(date -u +%H:%M:%S)"
          echo "=== BODY ==="
          cat /tmp/r1.json 2>/dev/null || echo "(vide)"
