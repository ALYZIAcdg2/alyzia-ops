name: Diagnostic — worker vivant + Gmail labels accessibles ?

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - name: Statut autopilot (léger, pas de Gmail)
        run: |
          curl -sS --max-time 30 "$BASE/api/autopilot/status" -o /tmp/s1.json
          echo "exit=$?"; cat /tmp/s1.json 2>/dev/null || echo "(vide)"
      - name: Relevé Gmail simple (labels, 1 seul appel Gmail)
        run: |
          curl -sS --max-time 30 "$BASE/api/autopilot/dry-list-survey?query=IZ744&maxMessages=1" -o /tmp/s2.json
          echo "exit=$?"; cat /tmp/s2.json 2>/dev/null || echo "(vide)"
