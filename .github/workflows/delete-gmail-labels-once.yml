name: Relevé Gmail lecture seule — état réel IZ744/IZ742 06SEP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - name: Fiche vol IZ744 06SEP 2026 (déjà en base ?)
        run: |
          curl -sS -f --max-time 60 -G "$BASE/api/autopilot/flight-summary" --data-urlencode "identity=2026-09-06|IZ|IZ744" -o /tmp/iz744.json || true
          echo "=== IZ744 ==="
          cat /tmp/iz744.json 2>/dev/null || echo "(vide)"
      - name: Fiche vol IZ742 06SEP 2026 (déjà en base ?)
        run: |
          curl -sS -f --max-time 60 -G "$BASE/api/autopilot/flight-summary" --data-urlencode "identity=2026-09-06|IZ|IZ742" -o /tmp/iz742.json || true
          echo "=== IZ742 ==="
          cat /tmp/iz742.json 2>/dev/null || echo "(vide)"
