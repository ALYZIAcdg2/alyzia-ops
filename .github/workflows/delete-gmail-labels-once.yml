name: Vide le Drive (après reconnexion OAuth)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clear_drive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - name: POST /api/autopilot/clear-drive
        run: |
          curl -sS -X POST "$BASE/api/autopilot/clear-drive" -H "Content-Type: application/json"
          echo
