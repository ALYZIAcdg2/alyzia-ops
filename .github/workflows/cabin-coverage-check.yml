name: Cabin — avions réellement utilisés vs plans déjà en base

# Étape 1 de la vérification réelle demandée par l'utilisateur : au lieu de
# revoir les 75 configs en vrac, on identifie d'abord quels couples
# compagnie/avion apparaissent vraiment dans les vols traités (table
# `flights`), puis on les compare à cabin_configs pour voir lesquels
# manquent ou ne sont qu'approximatifs.
#
# Le token Cloudflare de CI n'a que le droit de déployer le Worker, pas
# d'interroger D1 via l'API REST (wrangler d1 execute --remote échoue en
# 7403). On expose donc la comparaison via une route du Worker lui-même
# (/api/cabin/coverage, qui utilise le binding D1 direct, pas l'API REST),
# et on la lit ici en curl — même technique que l'import du seed.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
  CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - name: /api/cabin/coverage
        run: |
          curl -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" -sS -f "$API/api/cabin/coverage" -o coverage.json
          node -e "
            const j=JSON.parse(require('fs').readFileSync('coverage.json','utf8'));
            const rows=j.coverage||[];
            console.log('=== COUPLES AIRLINE/AIRCRAFT REELLEMENT VUS DANS LES VOLS (tries par frequence) ===');
            for(const r of rows){
              let status=r.status==='none'?'AUCUN PLAN'
                :r.status==='exact'?'OK (exact)'
                :'APPROXIMATIF: '+r.configs.map(c=>c.configuration+'='+c.quality).join(', ');
              console.log(String(r.flightCount).padStart(4)+'x  '+(r.airline+'|'+r.aircraft).padEnd(14)+' -> '+status);
            }
          "
