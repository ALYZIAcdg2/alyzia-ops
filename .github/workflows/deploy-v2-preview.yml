name: Deploy ALYZIA OPS v2 (preview, en construction)

on:
  push:
    branches:
      - claude/fiches-vides-v31pqy
    paths:
      - "v2/**"
      - ".github/workflows/deploy-v2-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alyzia-ops-v2-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy Worker (v2 preview — pas la production)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Vérifie /api/health sur le worker déployé
        run: |
          sleep 5
          curl -sS -f https://alyzia-ops-v2.alyzia-cdg2.workers.dev/api/health | tee /tmp/health.json
          echo
          if grep -q '"ok":true' /tmp/health.json; then
            echo "Santé OK"
          else
            echo "Santé KO" >&2
            exit 1
          fi
