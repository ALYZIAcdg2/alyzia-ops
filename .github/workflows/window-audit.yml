name: Audit fenêtre
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          D=$(date -u +%Y-%m-%d); F=$(date -u -d "$D -7 days" +%Y-%m-%d); T=$(date -u -d "$D +14 days" +%Y-%m-%d)
          curl -sS --compressed -o w.json "https://alyzia-ops.alyzia-cdg2.workers.dev/api/flights?from=$F&to=$T"
          node -e "
          const j=require('./w.json');const f=j.flights;const tot=JSON.stringify(j).length;
          const keys={};for(const x of f)for(const [k,v] of Object.entries(x)){keys[k]=(keys[k]||0)+JSON.stringify(v).length}
          console.log('vols',f.length,'octets',tot);
          console.log(Object.entries(keys).sort((a,b)=>b[1]-a[1]).slice(0,14).map(([k,v])=>k.padEnd(16)+(v/1e6).toFixed(2)+' Mo  '+Math.round(v/tot*100)+'%').join('\n'));
          const withP=f.filter(x=>x.passengers&&(Array.isArray(x.passengers)?x.passengers.length:Object.keys(x.passengers).length));
          console.log('vols avec passagers:',withP.length);
          const ex=withP[0];if(ex){console.log('forme passengers:',Array.isArray(ex.passengers)?'tableau de '+ex.passengers.length:'objet '+Object.keys(ex.passengers).length+' clés','| 1er élément:',JSON.stringify(Array.isArray(ex.passengers)?ex.passengers[0]:Object.values(ex.passengers)[0]).slice(0,260))}
          const cl=f.find(x=>x.common_lists&&Object.keys(x.common_lists).length);if(cl)console.log('forme common_lists:',Object.keys(cl.common_lists).slice(0,6).join(','),'| ex:',JSON.stringify(Object.values(cl.common_lists)[0]).slice(0,200));
          const en=f.find(x=>x.enrichment);if(en)console.log('forme enrichment:',JSON.stringify(en.enrichment).slice(0,260));
          const byAge={};const today=new Date().toISOString().slice(0,10);for(const x of f){const d=x.date<today?'passé':x.date===today?'aujourd hui':'futur';byAge[d]=byAge[d]||{n:0,b:0,p:0};byAge[d].n++;byAge[d].b+=JSON.stringify(x).length;byAge[d].p+=JSON.stringify(x.passengers||'').length}
          console.log('par période (nb, Mo total, dont passagers Mo):',Object.entries(byAge).map(([k,v])=>k+' '+v.n+' / '+(v.b/1e6).toFixed(2)+' / '+(v.p/1e6).toFixed(2)).join(' | '));
          "
