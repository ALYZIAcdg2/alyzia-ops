name: Add OAG STA test endpoint once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-oag-test-endpoint-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Add server-side OAG test endpoint
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='src/index.js';
          let s=fs.readFileSync(p,'utf8');
          if(s.includes('async function handleOag(')){
            console.log('OAG endpoint already present');
            process.exit(0);
          }

          const marker='async function handleSariaBridge(request,env,url){';
          const at=s.indexOf(marker);
          if(at<0)throw new Error('Saria marker not found');

          const block=`async function handleOag(request,env,url){
  if(!url.pathname.startsWith("/api/oag/"))return null;
  if(request.method==="OPTIONS")return json({ok:true});

  if(url.pathname==="/api/oag/flight-info" && request.method==="GET"){
    if(!env.OAG_API_KEY)return json({ok:false,error:"OAG_API_KEY NON CONFIGURE"},503);

    const carrier=String(url.searchParams.get("carrier")||"").trim().toUpperCase();
    const flight=String(url.searchParams.get("flight")||"").trim().toUpperCase().replace(/^[A-Z]{2}/,"");
    const date=String(url.searchParams.get("date")||"").trim();
    const origin=String(url.searchParams.get("origin")||"").trim().toUpperCase();
    const destination=String(url.searchParams.get("destination")||"").trim().toUpperCase();

    if(!carrier||!flight||!/^20\\d{2}-\\d{2}-\\d{2}$/.test(date)){
      return json({ok:false,error:"carrier, flight et date (YYYY-MM-DD) requis"},400);
    }

    const params=new URLSearchParams({
      DepartureDateTime:date,
      CarrierCode:carrier,
      FlightNumber:flight,
      CodeType:"IATA",
      version:"v2"
    });
    if(origin)params.set("DepartureAirport",origin);
    if(destination)params.set("ArrivalAirport",destination);

    const response=await fetch('https://api.oag.com/flight-instances/?'+params.toString(),{
      headers:{"Subscription-Key":env.OAG_API_KEY}
    });
    const text=await response.text();
    let payload=null;
    try{payload=JSON.parse(text)}catch{}

    if(!response.ok){
      return json({ok:false,error:"OAG "+response.status,details:payload||text.slice(0,1000)},response.status);
    }

    const rows=Array.isArray(payload?.data)?payload.data:[];
    const pick=rows.find(r=>{
      const c=String(r?.CarrierCode||r?.AirlineIata||r?.MarketingCarrier||"").toUpperCase();
      const n=String(r?.FlightNumber||r?.MarketingFlightNumber||"").replace(/^0+/,"");
      const want=String(flight).replace(/^0+/,"");
      const dep=String(r?.DepartureAirport||r?.DepartureAirportIata||"").toUpperCase();
      const arr=String(r?.ArrivalAirport||r?.ArrivalAirportIata||"").toUpperCase();
      return (!c||c===carrier) && (!n||n===want) && (!origin||!dep||dep===origin) && (!destination||!arr||arr===destination);
    }) || rows[0] || null;

    if(!pick)return json({ok:false,error:"VOL OAG INTROUVABLE",query:{carrier,flight,date,origin,destination}},404);

    const scheduledDeparture=pick.DepartureDateTime||pick.ScheduledDepartureDateTime||pick.ScheduledDeparture||"";
    const scheduledArrival=pick.ArrivalDateTime||pick.ScheduledArrivalDateTime||pick.ScheduledArrival||"";
    const sta=scheduledArrival?String(scheduledArrival).slice(11,16):"";
    const std=scheduledDeparture?String(scheduledDeparture).slice(11,16):"";

    return json({
      ok:true,
      source:"OAG",
      query:{carrier,flight,date,origin,destination},
      flight:{
        carrier:pick.CarrierCode||pick.AirlineIata||carrier,
        flightNumber:pick.FlightNumber||pick.MarketingFlightNumber||flight,
        origin:pick.DepartureAirport||pick.DepartureAirportIata||origin,
        destination:pick.ArrivalAirport||pick.ArrivalAirportIata||destination,
        scheduledDeparture,
        scheduledArrival,
        std,
        sta,
        aircraft:pick.AircraftType||pick.Equipment||"",
        status:pick.FlightStatus||pick.Status||""
      },
      matches:rows.length
    });
  }

  return json({ok:false,error:"ROUTE OAG INCONNUE"},404);
}

`;
          s=s.slice(0,at)+block+s.slice(at);

          const routeMarker='      if(url.pathname.startsWith("/api/saria/")){';
          const ri=s.indexOf(routeMarker);
          if(ri<0)throw new Error('Routing marker not found');
          const route=`      if(url.pathname.startsWith("/api/oag/")){
        const result=await handleOag(request,env,url);
        if(result)return result;
      }

`;
          s=s.slice(0,ri)+route+s.slice(ri);
          fs.writeFileSync(p,s);
          NODE

      - name: Verify source
        run: |
          grep -q 'async function handleOag' src/index.js
          grep -q '/api/oag/flight-info' src/index.js
          grep -q 'OAG_API_KEY' src/index.js
          grep -q 'Subscription-Key' src/index.js

      - name: Commit endpoint
        run: |
          git config user.name "ALYZIA OPS Bot"
          git config user.email "alyzia.cdg2@gmail.com"
          git add src/index.js
          if ! git diff --cached --quiet; then
            git commit -m "Ajoute endpoint OAG pour tester le STA"
            git push
          fi

