name: tmp 3 flights
on:
  push:
    paths: [".github/workflows/tmp-3flights.yml"]
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          U=https://alyzia-ops.alyzia-cdg2.workers.dev
          echo MARK-3F-1 > out.txt
          curl -sS -m 90 "$U/api/flights" -o f.json
          node -e '
          const j=require("./f.json");
          for(const x of (j.flights||[]).filter(x=>x.date==="2026-10-03"&&["AV55","HF177","SQ335"].includes(String(x.flight).toUpperCase()))){
            console.log("=====",x.flight,x.date,"std",x.std,"etd",x.etd,"atd",x.atd,"sta",x.sta,"eta",x.eta,"ata",x.ata,"gate",x.gate,"reg",x.reg,"aircraft",x.aircraft,"status",x.status);
            console.log("sources:",JSON.stringify({etd:x.etdSource,atd:x.atdSource,eta:x.etaSource,ata:x.ataSource,reg:x.regSource,gate:x.gateSource,aircraft:x.aircraftSource}),"change",JSON.stringify(x.aircraftChange),"key",x.sariaConfigKey);
            for(const l of (x.flightInfoLog||[]).slice(0,10))console.log("LOG",JSON.stringify(l).slice(0,160))}' >> out.txt
          git config user.name v && git config user.email v@v
          git checkout --orphan verify-out && git rm -rfq . 2>/dev/null; git add -f out.txt && git commit -qm result && git push -f origin verify-out
