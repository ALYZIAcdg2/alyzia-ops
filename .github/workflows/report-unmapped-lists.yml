name: Diagnostic — état actuel après échec du full-reset (HTTP 500)

# Lecture seule. Le run précédent (remise à zéro complète) a échoué avec une
# erreur 500 côté Worker pendant l'appel à /api/autopilot/full-reset, après
# ~92s. Avant de retenter quoi que ce soit, on vérifie l'état réel de la base
# (le wipe a-t-il eu lieu partiellement, totalement, ou pas du tout ?).

on:
  push:
    branches:
      - claude/fiches-vides-v31pqy
    paths:
      - ".github/workflows/report-unmapped-lists.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - name: État actuel (lecture seule uniquement)
        run: |
          echo "== /api/prepa/summary =="
          curl -sS "$BASE/api/prepa/summary" || true
          echo
          echo "== /api/flights (nombre) =="
          curl -sS "$BASE/api/flights" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{const j=JSON.parse(d);console.log((j.flights||j||[]).length)}catch(e){console.log("PARSE ERROR:",d.slice(0,500))}})' || true
          echo "== /api/gmail/status =="
          curl -sS "$BASE/api/gmail/status" || true
          echo
          echo "== /api/autopilot/status =="
          curl -sS "$BASE/api/autopilot/status" || true
          echo
