name: Rapport ponctuel — listes GENERIC non reconnues par compagnie

# Diagnostic en lecture seule : interroge /api/gmail/status pour connaître la
# taille réelle de la base avant de planifier une remise à zéro complète
# (suppression des vols + resynchronisation intégrale depuis Gmail, demandée
# explicitement par l'utilisateur). Se déclenche automatiquement au push de
# ce fichier (le proxy réseau de la session sandboxée ne peut pas atteindre
# *.workers.dev directement).

on:
  push:
    branches:
      - claude/fiches-vides-v31pqy
    paths:
      - ".github/workflows/report-unmapped-lists.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: État Gmail/pipeline (taille de la base avant remise à zéro)
        run: |
          curl -sS -f "https://alyzia-ops.alyzia-cdg2.workers.dev/api/gmail/status" | tee gmail-status.json
          echo
          echo "--- flights count ---"
          curl -sS -f "https://alyzia-ops.alyzia-cdg2.workers.dev/api/flights" \
            | node -e '
                let raw = "";
                process.stdin.on("data", d => raw += d);
                process.stdin.on("end", () => {
                  const data = JSON.parse(raw);
                  const flights = data.flights || data || [];
                  console.log("nombre de fiches vol:", Array.isArray(flights) ? flights.length : "?");
                });
              '
