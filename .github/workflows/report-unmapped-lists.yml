name: Rapport ponctuel — listes GENERIC non reconnues par compagnie

# Diagnostic en lecture seule : liste tous les aéroports (dep/dest) réellement
# utilisés en production, pour construire une table de fuseaux horaires
# complète et correcte (actuellement seulement 11 aéroports codés en dur avec
# un décalage FIXE, sans tenir compte de l'heure d'été/hiver).

on:
  push:
    branches:
      - claude/fiches-vides-v31pqy
    paths:
      - ".github/workflows/report-unmapped-lists.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Liste tous les aéroports dep/dest réellement utilisés
        run: |
          curl -sS -f "https://alyzia-ops.alyzia-cdg2.workers.dev/api/flights" \
            | node -e '
                let raw = "";
                process.stdin.on("data", d => raw += d);
                process.stdin.on("end", () => {
                  const data = JSON.parse(raw);
                  const flights = data.flights || data || [];
                  const byAirport = {};
                  for (const x of flights) {
                    for (const code of [x.dep, x.dest]) {
                      if (!code) continue;
                      byAirport[code] = (byAirport[code] || 0) + 1;
                    }
                  }
                  const sorted = Object.entries(byAirport).sort((a, b) => b[1] - a[1]);
                  console.log(`nombre daéroports distincts: ${sorted.length}\n`);
                  for (const [code, count] of sorted) {
                    console.log(`${code} : ${count} vol(s)`);
                  }
                });
              '
