name: Test de connexion Gmail après mise à jour du secret OAuth

# Vérifie que /api/gmail/sync-now fonctionne à nouveau après la régénération
# du GOOGLE_CLIENT_SECRET (l'ancien avait été désactivé côté Google, d'où
# l'erreur "The provided client secret is invalid." pendant la remise à
# zéro). Appel volontairement petit (maxMessages=3) : juste un test, pas
# encore la resynchronisation complète.

on:
  push:
    branches:
      - claude/fiches-vides-v31pqy
    paths:
      - ".github/workflows/report-unmapped-lists.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_gmail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - name: Petit appel de test sync-now (maxMessages=3)
        run: |
          echo "== POST /api/gmail/sync-now (test, maxMessages=3) =="
          curl -sS "$BASE/api/gmail/sync-now" \
            -X POST -H "Content-Type: application/json" \
            -d '{"query":"in:anywhere","maxMessages":3}'
          echo
          echo "== /api/gmail/status =="
          curl -sS "$BASE/api/gmail/status"
          echo
