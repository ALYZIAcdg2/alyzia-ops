name: tmp push tk
on:
  push:
    paths: [".github/workflows/tmp-push-tk.yml"]
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          U=https://alyzia-ops.alyzia-cdg2.workers.dev
          echo MARK-PTK-2 > out.txt
          sleep 75
          curl -sS -m 60 -X POST "$U/api/admin/push-now" >> out.txt; echo >> out.txt
          sleep 5
          curl -sS -m 60 "$U/api/flights" -o f.json
          node -e '
          const j=require("./f.json");const d=new Date().toISOString().slice(0,10);
          for(const x of (j.flights||[]).filter(x=>x.date===d)){ if(x.aircraftChange||x.flight==="TK1828") console.log(x.flight,"aircraft",x.aircraft,"change",JSON.stringify(x.aircraftChange),"key",x.sariaConfigKey,"cfg",JSON.stringify(x.config),"noCfg",x.aircraftChangeNoCabinConfig)}' >> out.txt
          git config user.name v && git config user.email v@v
          git checkout --orphan verify-out && git rm -rfq . 2>/dev/null; git add -f out.txt && git commit -qm result && git push -f origin verify-out
