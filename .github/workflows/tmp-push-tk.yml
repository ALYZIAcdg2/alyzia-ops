name: tmp push tk
on:
  push:
    paths: [".github/workflows/tmp-push-tk.yml"]
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          K: ${{ secrets.RAPIDAPI_PROBE_KEY }}
        run: |
          echo MARK-PTK-6 > out.txt
          NOW=$(date -u -d "-25 minutes" +%Y%m%d-%H:%M)
          for off in 0 100; do
            curl -sS -m 40 -H "x-rapidapi-key: $K" -H "x-rapidapi-host: kayak5.p.rapidapi.com" "https://kayak5.p.rapidapi.com/api/v1/flights/track/airport?limit=100&offset=$off&jitter=85&query_type=departure&datetime_str=$NOW&airport=cdg" -o b$off.json
            python3 - $off >> out.txt <<'P'
          import json,sys
          j=json.load(open("b"+sys.argv[1]+".json"))
          print("offset",sys.argv[1],{k:j.get(k) for k in ("count","total","hasMore")})
          for x in j.get("flights",[]):
            op=x.get("operatingFlight") or {}
            if x["flightNumber"]=="1828" or op.get("flightNumber")=="1828":
              print("ENTRY",x["airlineCode"]+x["flightNumber"],"op",op,"aircraft",repr(x.get("aircraft")),"status",x.get("statusCode"))
          print("sans aircraft:",sum(1 for x in j.get("flights",[]) if not x.get("aircraft")),"/",len(j.get("flights",[])))
          P
          done
          git config user.name v && git config user.email v@v
          git checkout --orphan verify-out && git rm -rfq . 2>/dev/null; git add -f out.txt && git commit -qm result && git push -f origin verify-out
