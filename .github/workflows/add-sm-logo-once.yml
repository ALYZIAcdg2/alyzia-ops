name: Ajoute logo Air Cairo SM

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-sm-logo-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Ajoute SM dans AIRLINE_LOGOS
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='public/index.html';
          let s=fs.readFileSync(p,'utf8');
          const url='https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/Air_Cairo_logo.svg/960px-Air_Cairo_logo.svg.png';
          // Ne pas tester un simple "SM:" dans tout index.html : SM peut exister
          // dans d'autres objets et faisait croire a tort que le logo etait deja la.
          if(s.includes(url)){
            console.log('Logo Air Cairo déjà présent');
            process.exit(0);
          }
          const marker='/* USER_AIRLINE_LOGOS_END */';
          const pos=s.indexOf(marker);
          if(pos<0)throw new Error('USER_AIRLINE_LOGOS_END introuvable');
          const before=s.slice(0,pos);
          const close=before.lastIndexOf('});');
          if(close<0)throw new Error('Fin AIRLINE_LOGOS introuvable');
          // Si une ancienne entree SM existe dans ce bloc, on la remplace;
          // sinon on ajoute la nouvelle entree juste avant la fermeture.
          const block=before.slice(0,close);
          const sm=/\bSM\s*:\s*['"][^'"]*['"]\s*,?/m;
          if(sm.test(block)){
            const fixed=block.replace(sm,`SM:'${url}',`);
            s=fixed+s.slice(close);
          }else{
            s=s.slice(0,close)+` SM:'${url}',\n`+s.slice(close);
          }
          fs.writeFileSync(p,s);
          NODE

      - name: Vérifie le logo SM
        run: |
          node <<'NODE'
          const s=require('fs').readFileSync('public/index.html','utf8');
          const url='https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/Air_Cairo_logo.svg/960px-Air_Cairo_logo.svg.png';
          if(!s.includes(`SM:'${url}'`) && !s.includes(`SM: '${url}'`)){
            throw new Error('Logo SM non injecté dans AIRLINE_LOGOS');
          }
          console.log('Logo SM présent');
          NODE

      - name: Commit
        run: |
          git config user.name "ALYZIA OPS Bot"
          git config user.email "alyzia.cdg2@gmail.com"
          git add public/index.html
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -m "Intègre réellement le logo Air Cairo SM"
          git push
