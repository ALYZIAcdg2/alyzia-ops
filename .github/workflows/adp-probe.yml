name: Sondage ADP
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sS -m 30 -A "Mozilla/5.0 Chrome/124" -o p.html -w "curl http=%{http_code} size=%{size_download}\n" https://www.parisaeroport.fr/vols/tableau-des-departs || true
          grep -oiE "(https?:)?//[a-z0-9./_-]*(api|flight|vol)[a-z0-9./_?=&-]*" p.html | sort -u | head -20 || true
      - run: |
          npm i playwright@1.49 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node scripts/adp-probe.mjs
