name: Test jeton admin
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ALYZIA_API_SECRET: ${{ secrets.ALYZIA_API_SECRET }}
    steps:
      - run: |
          A=https://alyzia-ops.alyzia-cdg2.workers.dev
          if [ -z "$ALYZIA_API_SECRET" ]; then echo "SECRET GITHUB ABSENT (vide)"; else echo "secret GitHub présent (longueur ${#ALYZIA_API_SECRET} caractères)"; fi
          echo "--- lecture seule /api/autopilot/status"
          curl -sS -o b1.txt -w "sans jeton        -> %{http_code}\n" "$A/api/autopilot/status"
          curl -sS -o b2.txt -w "mauvais jeton     -> %{http_code}\n" -H "Authorization: Bearer mauvais" "$A/api/autopilot/status"
          curl -sS -o b3.txt -w "jeton GitHub      -> %{http_code}\n" -H "Authorization: Bearer $ALYZIA_API_SECRET" "$A/api/autopilot/status"
          head -c 160 b3.txt; echo
