name: Deploy ALYZIA OPS to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alyzia-ops-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalise les codes appareil pour l'auto-config cabine
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='public/index.html';
          let s=fs.readFileSync(p,'utf8');
          const from="'TU|32A':'320'";
          const mappings=["'LY|772':'777'","'ENT|73H':'738'","'PC|32A':'320'","'PC|73H':'738'","'TK|321':'32R'"];
          if(!s.includes(from) && !mappings.every(m=>s.includes(m))) throw new Error('IMPORT_AIRCRAFT_CODE_MAP introuvable');
          if(s.includes(from)){
            const additions=mappings.filter(m=>!s.includes(m));
            if(additions.length) s=s.replace(from,from+','+additions.join(','));
          }
          fs.writeFileSync(p,s);
          console.log('Mappings import actifs: LY 772 -> 777 ; ENT 73H -> 738 ; PC 32A -> 320 ; PC 73H -> 738 ; TK 321 -> 32R');
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
