name: Deploy ALYZIA OPS to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alyzia-ops-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Injecte endpoint OAG STA dans le Worker déployé
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='src/index.js';
          let s=fs.readFileSync(p,'utf8');
          if(!s.includes('async function handleOag(')){
            const marker='async function handleSariaBridge(request,env,url){';
            const at=s.indexOf(marker);
            if(at<0)throw new Error('Saria marker not found');
            const block=`async function handleOag(request,env,url){
  if(!url.pathname.startsWith("/api/oag/"))return null;
  if(request.method==="OPTIONS")return json({ok:true});
  if(url.pathname==="/api/oag/flight-info" && request.method==="GET"){
    if(!env.OAG_API_KEY)return json({ok:false,error:"OAG_API_KEY NON CONFIGURE"},503);
    const carrier=String(url.searchParams.get("carrier")||"").trim().toUpperCase();
    const flight=String(url.searchParams.get("flight")||"").trim().toUpperCase().replace(/^[A-Z]{2}/,"");
    const date=String(url.searchParams.get("date")||"").trim();
    const origin=String(url.searchParams.get("origin")||"").trim().toUpperCase();
    const destination=String(url.searchParams.get("destination")||"").trim().toUpperCase();
    const apply=String(url.searchParams.get("apply")||"")==="1";
    if(!carrier||!flight||!/^20\\d{2}-\\d{2}-\\d{2}$/.test(date))return json({ok:false,error:"carrier, flight et date requis"},400);
    const params=new URLSearchParams({DepartureDateTime:date,CarrierCode:carrier,FlightNumber:flight,FlightType:"scheduled",CodeType:"IATA",version:"v2"});
    if(origin)params.set("DepartureAirport",origin);
    if(destination)params.set("ArrivalAirport",destination);
    const response=await fetch('https://api.oag.com/flight-instances/?'+params.toString(),{headers:{"Subscription-Key":env.OAG_API_KEY}});
    const text=await response.text();
    let payload=null;try{payload=JSON.parse(text)}catch{}
    if(!response.ok)return json({ok:false,error:"OAG "+response.status,details:payload||text.slice(0,1000)},response.status);
    const rows=Array.isArray(payload?.data)?payload.data:(Array.isArray(payload)?payload:[]);
    const pick=rows[0]||null;
    if(!pick)return json({ok:false,error:"VOL OAG INTROUVABLE",query:{carrier,flight,date,origin,destination}},404);
    const dep=pick.DepartureDateTime||pick.ScheduledDepartureDateTime||pick.ScheduledDeparture||pick.departure?.scheduledTime?.local||pick.departure?.scheduledTime||"";
    const arr=pick.ArrivalDateTime||pick.ScheduledArrivalDateTime||pick.ScheduledArrival||pick.arrival?.scheduledTime?.local||pick.arrival?.scheduledTime||"";
    const hhmm=v=>{const m=String(v||'').match(/(?:T|\\s)(\\d{2}:\\d{2})/);return m?m[1]:''};
    const sta=hhmm(arr), std=hhmm(dep);
    let applied=false,identity="";
    if(apply && sta){
      const full=(carrier+flight).toUpperCase();
      const row=await env.OPS_DB.prepare(`SELECT identity,data_json FROM flights WHERE flight_date=? AND UPPER(airline)=? AND (UPPER(flight_number)=? OR UPPER(flight_number)=?) LIMIT 1`).bind(date,carrier,full,flight.toUpperCase()).first();
      if(row){
        let x={};try{x=JSON.parse(row.data_json||'{}')}catch{}
        x.sta=sta;
        x.staSource='OAG';
        x.staUpdatedAt=new Date().toISOString();
        await env.OPS_DB.prepare(`UPDATE flights SET data_json=?,updated_at=CURRENT_TIMESTAMP WHERE identity=?`).bind(JSON.stringify(x),row.identity).run();
        applied=true;identity=String(row.identity||'');
      }
    }
    return json({ok:true,source:"OAG",query:{carrier,flight,date,origin,destination},flight:{scheduledDeparture:dep,scheduledArrival:arr,std,sta},matches:rows.length,applied,identity});
  }
  return json({ok:false,error:"ROUTE OAG INCONNUE"},404);
}

`;
            s=s.slice(0,at)+block+s.slice(at);
          }
          if(!s.includes('url.pathname.startsWith("/api/oag/")')){
            const routeMarker='      if(url.pathname.startsWith("/api/saria/")){';
            const ri=s.indexOf(routeMarker);
            if(ri<0)throw new Error('Routing marker not found');
            const route=`      if(url.pathname.startsWith("/api/oag/")){
        const result=await handleOag(request,env,url);
        if(result)return result;
      }

`;
            s=s.slice(0,ri)+route+s.slice(ri);
          }
          fs.writeFileSync(p,s);
          if(!s.includes('async function handleOag(')||!s.includes('/api/oag/flight-info'))throw new Error('OAG injection failed');
          NODE

      - name: Normalise les codes appareil pour l'auto-config cabine
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='public/index.html';
          let s=fs.readFileSync(p,'utf8');
          const from="'TU|32A':'320'";
          const mappings=[
            "'LY|772':'777'","'LY|77L':'777'","'LY|73H':'738'","'LY|73J':'739'",
            "'LS|73H':'738'",
            "'BJ|32A':'320'",
            "'A9|73H':'738'","'JU|32A':'320'","'SK|73H':'738'",
            "'AH|73W':'737'",
            "'ENT|73H':'738'","'PC|32A':'320'","'PC|73H':'738'",
            "'TK|321':'32R'","'TK|32B':'32R'"
          ];
          if(!s.includes(from) && !mappings.every(m=>s.includes(m))) throw new Error('IMPORT_AIRCRAFT_CODE_MAP introuvable');
          if(s.includes(from)){
            const additions=mappings.filter(m=>!s.includes(m));
            if(additions.length) s=s.replace(from,from+','+additions.join(','));
          }
          fs.writeFileSync(p,s);
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Teste OAG et applique le STA sur NH216
        run: |
          sleep 5
          curl -sS -f "https://alyzia-ops.alyzia-cdg2.workers.dev/api/oag/flight-info?carrier=NH&flight=216&date=2026-09-26&origin=CDG&destination=HND&apply=1"
