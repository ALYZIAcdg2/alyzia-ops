name: Test synchro par différences
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          A=https://alyzia-ops.alyzia-cdg2.workers.dev
          curl -sS --compressed -o f.json -w "COMPLET ttfb=%{time_starttransfer}s total=%{time_total}s size=%{size_download}B\n" "$A/api/flights"
          T=$(node -e "const j=require('./f.json');console.log(j.syncToken||'')")
          E=$(node -e "const j=require('./f.json');console.log('epoch=',JSON.stringify(j.epoch),'delta=',j.delta,'count=',j.count)")
          echo "token=$T $E"
          for i in 1 2 3; do curl -sS --compressed -G --data-urlencode "since=$T" -o d.json -w "DELTA ttfb=%{time_starttransfer}s total=%{time_total}s size=%{size_download}B\n" "$A/api/flights"; node -e "const j=require('./d.json');console.log('  delta=',j.delta,'vols=',j.count,'token=',j.syncToken)"; sleep 2; done
