name: tmp probe fr24api
on:
  push:
    paths: [".github/workflows/tmp-probe-fr24api.yml"]
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    env:
      K1: ${{ secrets.FR24API_TOKEN }}
      K2: ${{ secrets.FLIGHTRADAR24_API_TOKEN }}
      K3: ${{ secrets.FR24_API_TOKEN }}
      K4: ${{ secrets.FR24API_KEY }}
      K5: ${{ secrets.FLIGHTRADAR_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          : > out.txt
          K="${K1:-${K2:-${K3:-${K4:-$K5}}}}"
          if [ -z "$K" ]; then echo "AUCUN SECRET" >> out.txt; else
            export K
            python3 - >> out.txt <<'P'
          import os,json,time,urllib.request,urllib.error,datetime
          K=os.environ["K"];B="https://fr24api.flightradar24.com";UA="curl/8.5.0"
          def call(path,label):
              req=urllib.request.Request(B+path,headers={"Authorization":"Bearer "+K,"Accept":"application/json","Accept-Version":"v1","User-Agent":UA})
              try:
                  r=urllib.request.urlopen(req,timeout=40);code=r.status;body=r.read().decode()
              except urllib.error.HTTPError as e:
                  code=e.code;body=e.read().decode()
              except Exception as e:
                  code=0;body=str(e)
              print("=== "+label+" -> HTTP",code)
              try: d=json.loads(body)
              except Exception: print(body[:300]);d=None
              time.sleep(15);return d
          def show(d,n=2000): print(json.dumps(d,ensure_ascii=False)[:n])
          u=call("/api/usage","usage (avant)")
          if u: show(u,900)
          now=datetime.datetime.utcnow();fr=(now-datetime.timedelta(hours=10)).strftime("%Y-%m-%dT%H:%M:%S");to=now.strftime("%Y-%m-%dT%H:%M:%S")
          s=call("/api/flight-summary/light?flights=TK1824&flight_datetime_from="+fr+"&flight_datetime_to="+to+"&limit=3","summary light TK1824 (10 h)")
          if s: show(s,2200)
          ids=[x["fr24_id"] for x in (s or {}).get("data",[]) if x.get("datetime_takeoff")][:2]
          if ids:
              e=call("/api/historic/flight-events/full?flight_ids="+",".join(ids)+"&event_types=gate_departure,takeoff,landed,gate_arrival","events "+",".join(ids))
              if e: show(e,2400)
          l=call("/api/live/flight-positions/full?airports=outbound:CDG&limit=2","live positions CDG sortants (2)")
          if l: show(l,1800)
          u2=call("/api/usage","usage (après)")
          if u2: show(u2,900)
          P
          fi
          cat out.txt | head -c 12000
          git config user.name v && git config user.email v@v
          git checkout --orphan verify-out && git rm -rfq . 2>/dev/null; git add -f out.txt && git commit -qm result && git push -f origin verify-out
