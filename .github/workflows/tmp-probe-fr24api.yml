name: tmp probe fr24api
on:
  push:
    paths: [".github/workflows/tmp-probe-fr24api.yml"]
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    env:
      K1: ${{ secrets.FR24API_TOKEN }}
      K2: ${{ secrets.FLIGHTRADAR24_API_TOKEN }}
      K3: ${{ secrets.FR24_API_TOKEN }}
      K4: ${{ secrets.FR24API_KEY }}
      K5: ${{ secrets.FLIGHTRADAR_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          : > out.txt
          K="${K1:-${K2:-${K3:-${K4:-$K5}}}}"
          if [ -z "$K" ]; then echo "AUCUN SECRET (essayés: FR24API_TOKEN, FLIGHTRADAR24_API_TOKEN, FR24_API_TOKEN, FR24API_KEY, FLIGHTRADAR_API_TOKEN)" >> out.txt; else
            B=https://fr24api.flightradar24.com
            H1="Authorization: Bearer $K"; H2="Accept: application/json"; H3="Accept-Version: v1"
            D=$(date -u +%F)
            call(){ echo "=== GET $1" >> out.txt; curl -sS -m 40 -w "\nHTTP %{http_code}\n" -H "$H1" -H "$H2" -H "$H3" "$B$1" | head -c ${2:-3500} >> out.txt; echo >> out.txt; }
            call "/api/usage" 1500
            call "/api/flight-summary/light?flights=TK1824&flight_datetime_from=${D}T00:00:00&flight_datetime_to=${D}T23:59:59" 3500
            call "/api/live/flight-positions/full?flights=TK1824" 3500
          fi
          cat out.txt | head -c 9000
          git config user.name v && git config user.email v@v
          git checkout --orphan verify-out && git rm -rfq . 2>/dev/null; git add -f out.txt && git commit -qm result && git push -f origin verify-out
