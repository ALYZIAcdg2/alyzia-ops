name: tmp probe fr24api
on:
  push:
    paths: [".github/workflows/tmp-probe-fr24api.yml"]
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    env:
      K1: ${{ secrets.FR24API_TOKEN }}
      K2: ${{ secrets.FLIGHTRADAR24_API_TOKEN }}
      K3: ${{ secrets.FR24_API_TOKEN }}
      K4: ${{ secrets.FR24API_KEY }}
      K5: ${{ secrets.FLIGHTRADAR_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          : > out.txt
          K="${K1:-${K2:-${K3:-${K4:-$K5}}}}"
          if [ -z "$K" ]; then echo "AUCUN SECRET" >> out.txt; else
            export K
            python3 - >> out.txt <<'P'
          import os,json,urllib.request,urllib.error,datetime
          K=os.environ["K"];B="https://fr24api.flightradar24.com"
          UAS=["curl/8.5.0","Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36","Cloudflare-Workers"]
          state={"ua":0}
          def raw(path,ua):
              req=urllib.request.Request(B+path,headers={"Authorization":"Bearer "+K,"Accept":"application/json","Accept-Version":"v1","User-Agent":ua})
              try:
                  r=urllib.request.urlopen(req,timeout=40);return r.status,r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code,e.read().decode()
              except Exception as e:
                  return 0,str(e)
          def call(path,label):
              code,body=raw(path,UAS[state["ua"]])
              if code==403 and body.lstrip().startswith("<") and state["ua"]<len(UAS)-1:
                  print("   (403 page HTML avec UA",UAS[state["ua"]][:12],"-> essai avec un autre User-Agent)")
                  state["ua"]+=1;return call(path,label)
              print("=== "+label+" -> HTTP",code,"| UA:",UAS[state["ua"]][:14])
              try: return json.loads(body)
              except Exception:
                  print(body[:300]);return None
          def show(d,n=1800): print(json.dumps(d,ensure_ascii=False)[:n])
          u=call("/api/usage","usage")
          if u: show(u,1200)
          now=datetime.datetime.utcnow();fr=(now-datetime.timedelta(hours=8)).strftime("%Y-%m-%dT%H:%M:%S");to=now.strftime("%Y-%m-%dT%H:%M:%S")
          s=call("/api/flight-summary/light?airports=outbound:CDG&flight_datetime_from="+fr+"&flight_datetime_to="+to+"&limit=4","summary light CDG sortants (4)")
          if s: show(s,2200)
          ids=[x["fr24_id"] for x in (s or {}).get("data",[]) if x.get("datetime_takeoff")][:3]
          if ids:
              e=call("/api/historic/flight-events/full?flight_ids="+",".join(ids)+"&event_types=gate_departure,takeoff,landed,gate_arrival","events "+",".join(ids))
              if e: show(e,2600)
          l=call("/api/live/flight-positions/full?airports=outbound:CDG&limit=3","live positions CDG sortants (3)")
          if l: show(l,2200)
          u2=call("/api/usage","usage (après)")
          if u2: show(u2,1200)
          P
          fi
          cat out.txt | head -c 12000
          git config user.name v && git config user.email v@v
          git checkout --orphan verify-out && git rm -rfq . 2>/dev/null; git add -f out.txt && git commit -qm result && git push -f origin verify-out
