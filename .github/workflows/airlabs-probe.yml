name: Test AirLabs schedules (champs)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      AIRLABS_API_KEY: ${{ secrets.AIRLABS_API_KEY }}
    steps:
      - run: |
          if [ -z "$AIRLABS_API_KEY" ]; then echo "AIRLABS_API_KEY absente de GitHub"; exit 0; fi
          F="airline_iata,flight_iata,flight_number,dep_iata,dep_gate,dep_time,dep_estimated,dep_actual,arr_iata,arr_time,arr_estimated,arr_actual,reg_number"
          echo "--- sans aircraft_icao"; curl -sS -o /tmp/a.json -w "HTTP %{http_code}\n" "https://airlabs.co/api/v9/schedules?dep_iata=CDG&limit=2&_fields=$F&api_key=$AIRLABS_API_KEY"; head -c 300 /tmp/a.json | sed "s/$AIRLABS_API_KEY/***/g"; echo
          echo "--- avec aircraft_icao"; curl -sS -o /tmp/b.json -w "HTTP %{http_code}\n" "https://airlabs.co/api/v9/schedules?dep_iata=CDG&limit=2&_fields=$F,aircraft_icao&api_key=$AIRLABS_API_KEY"; head -c 300 /tmp/b.json | sed "s/$AIRLABS_API_KEY/***/g"; echo
