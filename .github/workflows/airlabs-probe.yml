name: Test AirLabs schedules (champs)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      AIRLABS_API_KEY: ${{ secrets.AIRLABS_API_KEY }}
    steps:
      - run: |
          if [ -z "$AIRLABS_API_KEY" ]; then echo "AIRLABS_API_KEY absente de GitHub"; exit 0; fi
          for i in 1 2 3; do
            curl -sS -o /tmp/r.json "https://airlabs.co/api/v9/schedules?dep_iata=CDG&limit=1&_fields=flight_iata&api_key=$AIRLABS_API_KEY"
            node -e "const j=require('/tmp/r.json');const k=(j.request||{}).key||{};delete k.api_key;console.log(new Date().toISOString(),JSON.stringify(k))"
            sleep 3
          done
