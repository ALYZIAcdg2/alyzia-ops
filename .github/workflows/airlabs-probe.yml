name: Test AirLabs (nouvelle clé)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      AIRLABS_API_KEY: ${{ secrets.AIRLABS_API_KEY }}
    steps:
      - run: |
          if [ -z "$AIRLABS_API_KEY" ]; then echo "AIRLABS_API_KEY absente de GitHub"; exit 0; fi
          F="airline_iata,flight_iata,flight_number,dep_iata,dep_gate,dep_time,dep_estimated,dep_actual,arr_iata,arr_time,arr_estimated,arr_actual,reg_number"
          code=$(curl -sS -m 40 -o /tmp/r.json -w "%{http_code}" "https://airlabs.co/api/v9/schedules?dep_iata=CDG&limit=50&offset=0&_fields=$F&api_key=$AIRLABS_API_KEY")
          echo "HTTP $code"
          # Aucun contenu brut n'est affiché : uniquement des champs choisis (jamais la clé).
          node -e "
          let j;try{j=require('/tmp/r.json')}catch(e){console.log('réponse non JSON');process.exit(0)}
          if(j.error){console.log('erreur AirLabs:',j.error.code||j.error.message);process.exit(0)}
          const k=(j.request||{}).key||{};
          console.log('vols reçus:',(j.response||[]).length);
          console.log('plan:',k.type,'| limite mois:',k.limits_by_month,'| restant (limits_total):',k.limits_total,'| expire:',k.expired);"
