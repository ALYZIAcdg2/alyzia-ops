name: Cabin — seed SM NH

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/cabin_seed_additions_sm_nh_20260925.json"
      - ".github/workflows/cabin-seed-additions-sm-nh.yml"

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Supprime les anciennes configs NH
        run: |
          node <<'NODE'
          const fs=require('fs');
          const o=JSON.parse(fs.readFileSync('scripts/cabin_seed_additions_sm_nh_20260925.json','utf8'));
          fs.writeFileSync('delete_keys.txt',[...new Set(o.deleteKeys||[])].join('\n')+'\n');
          NODE
          while IFS= read -r key; do
            [ -z "$key" ] && continue
            enc=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$key")
            curl -sS -f -X DELETE "$API/api/cabin/layout?key=$enc"
          done < delete_keys.txt

      - name: Seed SM et NH
        run: |
          node <<'NODE'
          const fs=require('fs');
          const o=JSON.parse(fs.readFileSync('scripts/cabin_seed_additions_sm_nh_20260925.json','utf8'));
          fs.writeFileSync('seed_payload.json',JSON.stringify({configs:o.configs||[]}));
          NODE
          curl -sS -f -X POST "$API/api/cabin/seed" -H "Content-Type: application/json" --data-binary @seed_payload.json
          curl -sS -f -X POST "$API/api/cabin/recompute-classes" >/dev/null

      - name: Réapplique les capacités opérationnelles
        run: |
          node <<'NODE'
          const fs=require('fs');
          const o=JSON.parse(fs.readFileSync('scripts/cabin_seed_additions_sm_nh_20260925.json','utf8'));
          fs.writeFileSync('operational.ndjson',(o.configs||[]).map(r=>JSON.stringify({configKey:r.configKey,airline:r.airline,aircraft:r.aircraft,configuration:r.configuration,total:r.operationalTotal,classes:r.operationalClasses,quality:r.quality,sourceLabel:r.sourceLabel})).join('\n')+'\n');
          NODE
          while IFS= read -r payload; do
            [ -z "$payload" ] && continue
            curl -sS -f -X POST "$API/api/cabin/config" -H "Content-Type: application/json" --data "$payload" >/dev/null
          done < operational.ndjson

      - name: Injection directe CONFIG NH depuis le catalogue
        run: |
          node <<'NODE'
          const fs=require('fs');
          async function main(){
            const seed=JSON.parse(fs.readFileSync('scripts/cabin_seed_additions_sm_nh_20260925.json','utf8'));
            const nhCfg=(seed.configs||[]).find(x=>String(x.airline).toUpperCase()==='NH'&&String(x.aircraft).toUpperCase()==='789');
            if(!nhCfg)throw new Error('Config NH 789 absente du seed');
            const config={...nhCfg.operationalClasses};
            const r=await fetch(process.env.API+'/api/flights');
            if(!r.ok)throw new Error('GET flights '+r.status);
            const j=await r.json();
            const rows=(j.flights||[]).filter(f=>String(f.airline||'').toUpperCase()==='NH'&&String(f.aircraft||'').toUpperCase()==='789');
            for(const f of rows){
              const identity=[f.date,f.airline,f.flight].join('|');
              const patch={sariaConfigKey:nhCfg.configKey,sariaCabinConfig:nhCfg.configuration,cabinConfigAuto:true,config};
              const p=await fetch(process.env.API+'/api/flights',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({identity,patch})});
              if(!p.ok)throw new Error(identity+' '+p.status+' '+await p.text());
            }
            console.log('NH 789 corrigés:',rows.length,nhCfg.configKey,JSON.stringify(config));
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Vérifie catalogue et vols NH
        run: |
          node <<'NODE'
          const fs=require('fs');
          async function main(){
            const seed=JSON.parse(fs.readFileSync('scripts/cabin_seed_additions_sm_nh_20260925.json','utf8'));
            const nhCfg=(seed.configs||[]).find(x=>String(x.airline).toUpperCase()==='NH'&&String(x.aircraft).toUpperCase()==='789');
            const wanted=nhCfg.operationalClasses||{};
            const cr=await fetch(process.env.API+'/api/cabin/configs');
            if(!cr.ok)throw new Error('GET configs '+cr.status);
            const cj=await cr.json();
            const c=(cj.configs||[]).find(x=>x.config_key===nhCfg.configKey);
            if(!c)throw new Error('Config catalogue absente '+nhCfg.configKey);
            let got={};try{got=JSON.parse(c.classes_json||'{}')}catch{}
            for(const [k,v] of Object.entries(wanted))if(Number(got[k])!==Number(v))throw new Error('Catalogue '+k+' attendu '+v+' reçu '+got[k]);
            for(const oldKey of seed.deleteKeys||[])if((cj.configs||[]).some(x=>x.config_key===oldKey))throw new Error('Ancienne config encore présente '+oldKey);
            const fr=await fetch(process.env.API+'/api/flights');
            if(!fr.ok)throw new Error('GET flights '+fr.status);
            const fj=await fr.json();
            const nh=(fj.flights||[]).filter(f=>String(f.airline||'').toUpperCase()==='NH'&&String(f.aircraft||'').toUpperCase()==='789');
            for(const f of nh){
              if(String(f.sariaConfigKey||'')!==nhCfg.configKey)throw new Error('Clé vol incorrecte '+f.flight+' '+f.sariaConfigKey);
              for(const [k,v] of Object.entries(wanted))if(Number(f.config?.[k])!==Number(v))throw new Error('Vol '+f.flight+' '+k+' attendu '+v+' reçu '+f.config?.[k]);
            }
            console.log('OK NH:',nhCfg.configKey,JSON.stringify(wanted),'vols',nh.length);
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE
