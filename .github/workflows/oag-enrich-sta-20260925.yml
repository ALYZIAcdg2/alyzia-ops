name: OAG enrich STA 2026-09-25 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oag-enrich-sta-20260925.yml'

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Cloudflare deployment
        run: sleep 35

      - name: Enrich STA from OAG
        run: |
          set -euo pipefail
          curl -sS --fail-with-body --max-time 600 \
            'https://alyzia-ops.alyzia-cdg2.workers.dev/api/oag/enrich-sta?date=2026-09-25&limit=100&paceMs=1400' \
            | tee /tmp/oag-sta.json
          echo
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/oag-sta.json','utf8')); const s=r.summary||{}; console.log('FOUND='+s.found,'LOOKUPS='+s.lookups,'UPDATED='+s.updated,'ALREADY_OAG='+s.alreadyOag,'PROTECTED='+s.protected,'SKIPPED='+s.skipped,'NOT_FOUND='+s.notFound,'ERRORS='+s.errors); if(!r.ok) process.exit(1);"
