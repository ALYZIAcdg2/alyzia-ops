name: Test Cloudflare Access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          A=https://alyzia-ops.alyzia-cdg2.workers.dev
          for p in / /api/enrichment/status "/api/weather?iata=CDG" "/api/flights?identity=2099-12-31%7CSYS%7CCOMPANY_CONFIG" /api/autopilot/status; do
            curl -sS -o /dev/null -w "GET $p -> %{http_code}\n" "$A$p"
          done
