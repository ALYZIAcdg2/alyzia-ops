name: tmp verify pause
on:
  push:
    paths: [".github/workflows/tmp-verify-pause.yml"]
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          U=https://alyzia-ops.alyzia-cdg2.workers.dev
          : > out.txt
          for i in $(seq 1 22); do
            curl -sS -m 60 "$U/api/admin/provider-observability" -o o.json || echo '{}' > o.json
            curl -sS -m 60 "$U/api/admin/flight-processing" -o a.json || echo '{}' > a.json
            python3 - >> out.txt <<'P'
          import json,datetime
          o=json.load(open("o.json"));a=json.load(open("a.json"))
          for r in o.get("rows",[]):
            if r["provider"] in("KAYAK","FLIGHTERA","FLIGHTRADAR1","FLIGHTRADAR8"):
              e=r.get("lastError")
              print(datetime.datetime.utcnow().strftime("%H:%M:%S"),r["provider"].ljust(12),"appels",str(r.get("performed")).rjust(3),"HTTP",r.get("lastStatus"),"dernier",(r.get("lastAt") or "")[11:19],"| pause/erreur:",(str(e.get("status"))+" "+(e.get("message") or "")[:50]+" jusqu'à "+(e.get("until") or "-")[11:19]) if e else "aucune")
          P
            sleep 40
          done
          cat out.txt | tail -12
          git config user.name v && git config user.email v@v
          git checkout --orphan verify-out && git rm -rfq . 2>/dev/null; git add -f out.txt && git commit -qm result && git push -f origin verify-out
