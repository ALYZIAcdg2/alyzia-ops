name: tmp verify kayak ent
on:
  push:
    paths: [".github/workflows/tmp-verify-kayak-ent.yml"]
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          U=https://alyzia-ops.alyzia-cdg2.workers.dev
          : > out.txt
          F=$(date -u -d "-1 day" +%F); T=$(date -u -d "+7 day" +%F)
          for i in $(seq 1 40); do
            curl -sS -m 60 "$U/api/admin/flight-processing" -o a.json || echo '{}' > a.json
            curl -sS -m 60 "$U/api/admin/provider-observability" -o o.json || echo '{}' > o.json
            curl -sS -m 60 --compressed "$U/api/flights?from=$F&to=$T" -o f.json || echo '{"flights":[]}' > f.json
            python3 - >> out.txt <<'P'
          import json,datetime
          a=json.load(open("a.json"));o=json.load(open("o.json"));f=json.load(open("f.json"))
          q=[x for x in a.get("quotas",[]) if x["provider"]=="KAYAK"]
          k=[r for r in o.get("rows",[]) if r["provider"]=="KAYAK"]
          ent=[x for x in f.get("flights",[]) if str(x.get("airline","")).upper() in("ENT","E4")]
          ac={}
          for x in ent: ac[x.get("aircraft")]=ac.get(x.get("aircraft"),0)+1
          nocfg=[x.get("flight") for x in ent if str(x.get("aircraft","")).upper() in("738","73H") and not x.get("sariaConfigKey")]
          print(datetime.datetime.utcnow().strftime("%H:%M:%S"),"KAYAK quota:",q[0] if q else "ABSENT (ancien déploiement)","| obs:",{k2:k[0].get(k2) for k2 in("performed","lastStatus","waiting")} if k else "ABSENT","| ENT",len(ent),"types",ac,"| 738/73H sans config:",len(nocfg),nocfg[:6])
          P
            tail -1 out.txt
            if grep -q "KAYAK quota: {" out.txt && tail -1 out.txt | grep -q "sans config: 0"; then break; fi
            sleep 30
          done
          git config user.name v && git config user.email v@v
          git checkout --orphan verify-out && git rm -rfq . 2>/dev/null; git add -f out.txt && git commit -qm result && git push -f origin verify-out
