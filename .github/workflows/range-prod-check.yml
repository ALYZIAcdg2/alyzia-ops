name: Test chargement par dates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm i playwright@1.49 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node scripts/range-prod-check.mjs
