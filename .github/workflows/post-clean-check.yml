name: Test après nettoyage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          A=https://alyzia-ops.alyzia-cdg2.workers.dev
          for i in 1 2 3 4 5 6; do
            curl -sS -H "Accept-Encoding: br" -D h.txt -o /dev/null -w "page ttfb=%{time_starttransfer}s total=%{time_total}s " "$A/?r=$i$RANDOM"
            grep -ihE "^(x-alyzia-page|x-alyzia-bake-fallback)" h.txt | tr -d '\r' | tr '\n' ' '; echo
            sleep 1
          done
          for p in /api/enrichment/status "/api/weather?iata=CDG" "/api/flights?from=2026-09-25&to=2026-10-14" /api/cabin/configs /api/autopilot/status; do
            curl -sS -o b.txt -w "GET $p -> %{http_code} taille=%{size_download}B\n" "$A$p"
          done
