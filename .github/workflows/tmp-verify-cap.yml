name: tmp verify cap
on:
  push:
    paths: [".github/workflows/tmp-verify-cap.yml"]
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          U=https://alyzia-ops.alyzia-cdg2.workers.dev/api/admin/provider-observability
          : > out.txt
          for i in $(seq 1 18); do
            curl -sS -m 40 "$U" -o o.json || echo '{}' > o.json
            python3 - >> out.txt <<'P'
          import json,datetime
          d=json.load(open("o.json"))
          r=[x for x in d.get("rows",[]) if x["provider"]=="FLIGHTERA"]
          x=r[0] if r else {}
          print(datetime.datetime.utcnow().strftime("%H:%M:%S"),"FLIGHTERA appels",x.get("performed"),"HTTP",x.get("lastStatus"),"dernier",x.get("lastAt"),"attente",x.get("waiting"),"champ_lastError_present","lastError" in x,"erreur",x.get("lastError"))
          P
            tail -1 out.txt
            python3 -c "
          import re,sys
          l=open('out.txt').read().strip().splitlines()[-1]
          m=re.search(r'appels (\d+)',l)
          sys.exit(0 if m and int(m.group(1))>20 else 1)" && break
            sleep 60
          done
          git config user.name v && git config user.email v@v
          git checkout --orphan verify-out && git rm -rfq . && cp /dev/null x && rm x
          git add -f out.txt 2>/dev/null || true
          git commit -qm result && git push -f origin verify-out
