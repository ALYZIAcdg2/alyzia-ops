name: Cabin — import du lot de plans (seed)

# Importe automatiquement la base cabine quand les fichiers seed changent.
# Le lancement manuel reste disponible pour un rejeu ponctuel.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/cabin_seed.json"
      - "scripts/cabin_seed_delete_keys.json"
      - "scripts/cabin_seed_overrides.json"
      - ".github/workflows/cabin-seed.yml"

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API: https://alyzia-ops.alyzia-cdg2.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prépare les suppressions de config_key
        run: |
          node -e "
            const fs=require('fs');
            const keys=[];
            if (fs.existsSync('scripts/cabin_seed_delete_keys.json')) {
              keys.push(...JSON.parse(fs.readFileSync('scripts/cabin_seed_delete_keys.json','utf8')));
            }
            if (fs.existsSync('scripts/cabin_seed_overrides.json')) {
              const o=JSON.parse(fs.readFileSync('scripts/cabin_seed_overrides.json','utf8'));
              keys.push(...(o.deleteKeys||[]));
            }
            const unique=[...new Set(keys.filter(Boolean))];
            console.log('Cles a supprimer avant import:', unique.length);
            require('fs').writeFileSync('delete_keys.txt', unique.join('\n') + (unique.length?'\n':''));
          "
          while IFS= read -r key; do
            [ -z "$key" ] && continue
            echo "DELETE $key"
            curl -sS -f -X DELETE "$API/api/cabin/layout?key=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$key")"
          done < delete_keys.txt

      - name: Construit le payload effectif {configs:[...]}
        run: |
          node -e "
            const fs=require('fs');
            let rows=JSON.parse(fs.readFileSync('scripts/cabin_seed.json','utf8'));
            if (fs.existsSync('scripts/cabin_seed_overrides.json')) {
              const overrides=JSON.parse(fs.readFileSync('scripts/cabin_seed_overrides.json','utf8'));
              const deleteKeys=new Set(overrides.deleteKeys||[]);
              rows=rows.filter(r=>!deleteKeys.has(r.configKey));
              const byKey=new Map(rows.map(r=>[r.configKey,r]));
              for (const row of (overrides.configs||[])) byKey.set(row.configKey,row);
              rows=[...byKey.values()];
              console.log('Overrides appliques:', (overrides.configs||[]).length, '/ suppressions logiques:', deleteKeys.size);
            }
            fs.writeFileSync('seed_payload.json', JSON.stringify({configs: rows}));
            console.log('Configs a importer:', rows.length);
          "

      - name: POST /api/cabin/seed
        run: |
          curl -sS -f -X POST "$API/api/cabin/seed" \
            -H "Content-Type: application/json" \
            --data-binary @seed_payload.json | tee seed_result.json
          echo
          cat seed_result.json

      - name: Recalcule classes_json et total
        run: |
          curl -sS -f -X POST "$API/api/cabin/recompute-classes" | tee recompute_result.json
          echo
          node -e "
            const j=JSON.parse(require('fs').readFileSync('recompute_result.json','utf8'));
            console.log('Configs recalculees:', j.updated, '/ modifiees:', j.changed);
          "

      - name: Vérifie LY 777 et la disparition de LY 772
        run: |
          curl -sS -f "$API/api/cabin/configs" -o all_configs.json
          node -e "
            const j=JSON.parse(require('fs').readFileSync('all_configs.json','utf8'));
            const configs=j.configs||[];
            const ly777=configs.filter(c=>c.config_key==='LY|777|28C32W253Y');
            const ly772=configs.filter(c=>c.config_key==='LY|772|28C32W253Y');
            console.log('LY 777:', JSON.stringify(ly777));
            console.log('LY 772 restant:', ly772.length);
            if (ly777.length!==1 || ly772.length!==0) process.exit(1);
          "

      - name: Vérifie le plan LY 777 complet
        run: |
          curl -sS -f "$API/api/cabin/layout?key=LY%7C777%7C28C32W253Y" | node -e "
            let data='';process.stdin.on('data',d=>data+=d);process.stdin.on('end',()=>{
              const j=JSON.parse(data);
              console.log('ok=',j.ok,'zones=',(j.zones||[]).length);
              if(!j.ok || (j.zones||[]).length!==3) process.exit(1);
            });
          "
