name: Audit données vols
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          curl -sS --compressed -m 120 -o f.json https://alyzia-ops.alyzia-cdg2.workers.dev/api/flights
          node -e "
          const j=require('./f.json');const f=j.flights;const today=new Date().toISOString().slice(0,10);
          const b={};const add=(k,x)=>{b[k]=b[k]||{n:0,bytes:0};b[k].n++;b[k].bytes+=JSON.stringify(x).length};
          const day=s=>Math.round((Date.parse(today)-Date.parse(s))/864e5);
          for(const x of f){const d=day(String(x.date||'').slice(0,10));const k=isNaN(d)?'sans date':d<-7?'futur >7j':d<=0?'aujourd hui..+7j':d<=7?'J-1..J-7':d<=30?'J-8..J-30':d<=90?'J-31..J-90':'>J-90';add(k,x)}
          console.log('REPARTITION PAR AGE (nb vols, Mo)');for(const [k,v] of Object.entries(b))console.log(' ',k.padEnd(20),String(v.n).padStart(6),(v.bytes/1e6).toFixed(1)+' Mo');
          const dates=f.map(x=>String(x.date||'')).filter(Boolean).sort();console.log('plus ancien',dates[0],'plus récent',dates[dates.length-1]);
          // champs lourds : nature
          const withImp=f.filter(x=>x.imports);console.log('vols avec imports',withImp.length);
          const s=withImp.sort((a,b)=>JSON.stringify(b.imports).length-JSON.stringify(a.imports).length);
          const big=s[0];console.log('plus gros imports:',big.date,big.airline,big.flight,typeof big.imports,Array.isArray(big.imports)?('tableau de '+big.imports.length):Object.keys(big.imports).length+' clés',(JSON.stringify(big.imports).length/1e6).toFixed(2)+' Mo');
          const one=Array.isArray(big.imports)?big.imports[0]:Object.values(big.imports)[0];console.log('forme d un élément:',JSON.stringify(one).slice(0,300));
          const med=s[Math.floor(s.length/2)];console.log('imports médian',(JSON.stringify(med.imports).length/1e3).toFixed(1)+' Ko');
          const fieldsByAge={};for(const x of f){const d=day(String(x.date||'').slice(0,10));const old=d>30;for(const k of ['imports','common_lists','passengers','enrichment']){fieldsByAge[k]=fieldsByAge[k]||{recent:0,old:0};fieldsByAge[k][old?'old':'recent']+=x[k]?JSON.stringify(x[k]).length:0}}
          console.log('HEAVY par age (Mo recent<=30j / ancien>30j)');for(const [k,v] of Object.entries(fieldsByAge))console.log(' ',k.padEnd(14),(v.recent/1e6).toFixed(1),(v.old/1e6).toFixed(1));
          "
