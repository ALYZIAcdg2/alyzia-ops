name: tmp ac
on:
  push:
    paths: [".github/workflows/tmp-ac.yml"]
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          U=https://alyzia-ops.alyzia-cdg2.workers.dev
          echo MARK-AC-2 > out.txt
          curl -sS -m 60 "$U/api/flights" -o f.json
          node -e '
          const j=require("./f.json");
          for(const x of j.flights||[]){ if(!x.aircraftChange) continue;
            console.log(x.date,x.flight,"aircraft=",x.aircraft,"imported=",x.aircraftImported,"change=",JSON.stringify(x.aircraftChange),"key=",x.sariaConfigKey,"cab=",x.sariaCabinConfig,"cfg=",JSON.stringify(x.config),"noCfg=",x.aircraftChangeNoCabinConfig,"applied=",x.aircraftChangeCabinApplied,"auto=",x.cabinConfigAuto)}' >> out.txt
          curl -sS -m 60 "$U/api/cabin/configs" -o c.json
          node -e '
          const j=require("./c.json");const a=j.configs||j.rows||j;
          const want=[["LY","772"],["DE","321"],["TK","32Q"],["TK","321"],["TK","359"],["FI","763"],["TB","738"],["TK","32N"]];
          console.log("total",Array.isArray(a)?a.length:Object.keys(j));
          for(const [al,ac] of want)console.log(al,ac,(a||[]).filter(r=>(r.airline||"").toUpperCase()===al&&(r.aircraft||"").toUpperCase()===ac).map(r=>r.config_key||r.configKey).join(", ")||"AUCUNE")' >> out.txt
          git config user.name v && git config user.email v@v
          git checkout --orphan verify-out && git rm -rfq . 2>/dev/null; git add -f out.txt && git commit -qm result && git push -f origin verify-out
