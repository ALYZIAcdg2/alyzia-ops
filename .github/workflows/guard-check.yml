name: Test protection API
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          A=https://alyzia-ops.alyzia-cdg2.workers.dev
          echo "--- doivent être refusés (lecture seule : aucune action destructive n'est tentée)"
          for p in /api/autopilot/status /api/autopilot/audit /api/gmail-clean/purge-historical-sq /api/import-pipeline/process-next; do curl -sS -o b.txt -w "GET $p -> %{http_code} " "$A$p"; head -c 120 b.txt; echo; done
          echo "--- doivent rester ouverts"
          for p in "/api/flights?identity=2099-12-31%7CSYS%7CCOMPANY_CONFIG" /api/cabin/configs /api/weather?iata=CDG /api/import-pipeline/status /api/enrichment/status /; do curl -sS -o /dev/null -w "GET $p -> %{http_code}\n" "$A$p"; done
