name: Test RapidAPI flight-radar1 (recherche vol)

on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Vols à chercher, séparés par des virgules"
        default: "TK1822,LO332"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Sondage
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY || secrets.QUARK_RAPIDAPI_KEY || secrets.AVIATIONDATA_RAPIDAPI_KEY }}
          RAPIDAPI_KEY_FR1: ${{ secrets.FLIGHT_RADAR1_RAPIDAPI_KEY }}
          QUERIES: ${{ github.event.inputs.queries }}
        run: node scripts/rapidapi_probe.mjs
