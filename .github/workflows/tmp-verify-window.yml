name: tmp verify window
on:
  push:
    paths: [".github/workflows/tmp-verify-window.yml"]
  workflow_dispatch:
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://alyzia-ops.alyzia-cdg2.workers.dev
          for i in $(seq 1 30); do
            curl -sS -m 40 -D h.txt -o p.html "$U/" && grep -q "OPS_WINDOW_BACK=1,OPS_WINDOW_FWD=7" p.html && break
            sleep 20
          done
          grep -i "x-alyzia\|HTTP/" h.txt; grep -o "OPS_WINDOW_BACK=[0-9]*,OPS_WINDOW_FWD=[0-9]*,OPS_MAX_GAP_DAYS=[0-9]*" p.html; grep -c "opsScheduleBackgroundAll();" p.html || true
          D=$(date -u +%F); F=$(date -u -d "-1 day" +%F); T=$(date -u -d "+7 day" +%F)
          curl -sS -m 60 -w "\nflights window: %{size_download} bytes %{time_total}s\n" -o f.json "$U/api/flights?from=$F&to=$T"
          python3 - <<'P'
          import json
          d=json.load(open("f.json")); fl=[x for x in d["flights"] if x.get("flight_date") or x.get("date")]
          ds=sorted({x.get("date") or x.get("flight_date") for x in fl if (x.get("date") or x.get("flight_date"))})
          print("records",len(d["flights"]),"dates",ds[:1],ds[-1:])
          P
          curl -sS -m 60 "$U/api/admin/flight-processing" -o a.json -w "admin %{http_code} %{time_total}s\n"
          python3 - <<'P'
          import json
          d=json.load(open("a.json")); print("ok",d.get("ok"),"since",d.get("since"),"until",d.get("until"),"rows",len(d.get("flights",[])),"dates",sorted({x["date"] for x in d["flights"]}),d.get("summary"))
          P
