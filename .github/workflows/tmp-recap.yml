name: tmp recap
on:
  push:
    paths: [".github/workflows/tmp-recap.yml"]
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          U=https://alyzia-ops.alyzia-cdg2.workers.dev
          echo MARK-RECAP-1 > out.txt
          curl -sS -m 60 "$U/api/admin/provider-observability" -o o.json || echo '{}' > o.json
          curl -sS -m 60 "$U/api/admin/flight-processing" -o a.json || echo '{}' > a.json
          curl -sS -m 60 "$U/api/flights" -o f.json
          python3 - >> out.txt <<'P'
          import json,collections,datetime
          o=json.load(open("o.json"));a=json.load(open("a.json"));f=json.load(open("f.json"))
          print("== PROVIDERS (jour: appels/succes/erreurs, dernier statut, état)")
          for r in o.get("rows",[]):
            st=(r.get("state") or {}).get("label","")
            e=r.get("lastError")
            print(r["provider"].ljust(13),"appels",r.get("performed"),"ok",r.get("successes"),"err",r.get("errors"),"last",r.get("lastStatus"),"| pot",r.get("potential"),"att",r.get("waiting"),"evit",r.get("avoided"),"stop",r.get("stop"),"|",st[:70],"| ERR:",(str(e.get("status"))+" "+(e.get("message") or "")[:40]) if e else "-")
          print("== QUOTAS")
          for q in a.get("quotas",[]): print(q.get("provider"),"jour",q.get("today"),"mois",q.get("month"),"limite",q.get("limit"),q.get("lastStatus"))
          t=datetime.datetime.utcnow().strftime("%Y-%m-%d")
          fl=[x for x in f.get("flights",[]) if x.get("date")==t]
          print("== VOLS DU JOUR",len(fl))
          has=lambda v:v and str(v).strip() not in("","—")
          for fld in("etd","atd","eta","ata","gate","reg","sta"):
            c=collections.Counter((x.get(fld+"Source") or "?") for x in fl if has(x.get(fld)))
            print(fld,sum(c.values()),dict(c))
          dep=[x for x in fl if has(x.get("atd"))]
          print("departed",len(dep),"avec ata",sum(1 for x in dep if has(x.get("ata"))))
          print("ETD renseignes (retard):",sum(1 for x in fl if has(x.get("etd"))))
          P
          git config user.name v && git config user.email v@v
          git checkout --orphan verify-out && git rm -rfq . 2>/dev/null; git add -f out.txt && git commit -qm result && git push -f origin verify-out
