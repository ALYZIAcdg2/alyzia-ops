name: tmp v2 status
on:
  push:
    paths: [".github/workflows/tmp-v2status.yml"]
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo MARK-V2S-1 > out.txt
          U=https://alyzia-ops-v2.alyzia-cdg2.workers.dev
          curl -sS -m 60 -o v2.json -w "V2 /api/flights HTTP %{http_code} %{size_download}B\n" "$U/api/flights" >> out.txt
          head -c 200 v2.json >> out.txt; echo >> out.txt
          node -e '
          let j;try{j=require("./v2.json")}catch(e){console.log("pas de JSON");process.exit()}
          const L=(j.flights||j.items||j||[]);const arr=Array.isArray(L)?L:[];
          console.log("vols V2:",arr.length);
          const d=new Set(arr.map(x=>x.date));console.log("dates:",[...d].sort().slice(-5).join(","));
          for(const x of arr.filter(x=>x.date==="2026-10-03"&&["AV55","HF177","SQ335"].includes(String(x.flight).toUpperCase()))){
            console.log("=====",x.flight,"status",x.status,"| src",x.statusSource,"| reason",x.statusReason);
            console.log(JSON.stringify({std:x.std,etd:x.etd,atd:x.atd,atdSource:x.atdSource,takeoff:x.takeoff,landing:x.landing,eta:x.eta,ata:x.ata,paris:x.parisAeroportPhase,evid:x.statusModelEvidence,pub:x.publicLiveBackfill&&{atd:x.publicLiveBackfill.atd,takeoff:x.publicLiveBackfill.takeoff,eta:x.publicLiveBackfill.eta,status:x.publicLiveBackfill.status,attempts:x.publicLiveBackfill.attempts}}).slice(0,900))}' >> out.txt
          git config user.name v && git config user.email v@v
          git checkout --orphan verify-out && git rm -rfq . 2>/dev/null; git add -f out.txt && git commit -qm result && git push -f origin verify-out
