name: tmp bake
on:
  push:
    paths: [".github/workflows/tmp-bake.yml"]
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          U=https://alyzia-ops.alyzia-cdg2.workers.dev
          : > out.txt
          for i in 1 2 3 4 5 6; do
            curl -sS -m 40 -D h.txt -o /dev/null -w "%{time_starttransfer}s" $U/ >> out.txt
            echo " $(grep -i 'x-alyzia' h.txt | tr -d '\r' | tr '\n' ' ')" >> out.txt
            curl -sS -m 40 -o /dev/null -w "baked-index direct: %{http_code}\n" $U/baked-index >> out.txt
            sleep 20
          done
          cat out.txt
          git config user.name v && git config user.email v@v
          git checkout --orphan verify-out && git rm -rfq . 2>/dev/null; git add -f out.txt && git commit -qm result && git push -f origin verify-out
