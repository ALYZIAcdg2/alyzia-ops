name: tmp verify ui
on:
  push:
    paths: [".github/workflows/tmp-verify-ui.yml"]
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for i in $(seq 1 20); do curl -sS -m 40 https://alyzia-ops.alyzia-cdg2.workers.dev/ | grep -q "alyzia-home-filter-count-sync" && curl -sS -m 40 https://alyzia-ops.alyzia-cdg2.workers.dev/ | grep -q "700,1500,2500" && break; sleep 20; done
          mkdir t && cd t && npm init -y >/dev/null && npm i playwright >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cp ../scripts/tmp-verify-ui.mjs . && node tmp-verify-ui.mjs || true
          cd .. && git config user.name v && git config user.email v@v
          git checkout --orphan verify-out && git rm -rfq . && cp t/verify-ui-result.txt . 2>/dev/null || echo "no result" > verify-ui-result.txt
          git add verify-ui-result.txt && git commit -qm result && git push -f origin verify-out
# rerun 2
