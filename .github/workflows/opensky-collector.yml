name: Collecte OpenSky

# OpenSky ne répond pas depuis Cloudflare: les positions d'avions autour de CDG sont récupérées ici
# puis envoyées à l'application (POST /api/opensky/ingest).
# Secrets GitHub requis: ALYZIA_INGEST_URL, OPENSKY_INGEST_TOKEN. Facultatifs: OPENSKY_CLIENT_ID, OPENSKY_CLIENT_SECRET.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: opensky-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Collecter et envoyer
        env:
          ALYZIA_INGEST_URL: ${{ secrets.ALYZIA_INGEST_URL }}
          OPENSKY_INGEST_TOKEN: ${{ secrets.OPENSKY_INGEST_TOKEN }}
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: node scripts/opensky_collect.mjs
