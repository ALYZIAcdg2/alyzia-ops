name: Collecte OpenSky

# OpenSky ne répond pas depuis Cloudflare: les positions d'avions autour de CDG sont récupérées ici
# puis envoyées à l'application (POST /api/opensky/ingest).
# Secrets GitHub requis: ALYZIA_INGEST_URL, OPENSKY_INGEST_TOKEN. Facultatifs: OPENSKY_CLIENT_ID, OPENSKY_CLIENT_SECRET.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: opensky-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Mois courant (clé du cache)
        id: month
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Base d'avions OpenSky (cache mensuel)
        id: aircraftdb
        uses: actions/cache@v4
        with:
          path: aircraftDatabase.csv
          key: aircraft-db-${{ steps.month.outputs.m }}
      - name: Télécharger la base d'avions si absente du cache
        if: steps.aircraftdb.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          curl -sSL --fail --max-time 240 -o aircraftDatabase.csv "https://opensky-network.org/datasets/metadata/aircraftDatabase.csv"
          ls -l aircraftDatabase.csv
      - name: Collecter et envoyer
        env:
          ALYZIA_INGEST_URL: ${{ secrets.ALYZIA_INGEST_URL }}
          OPENSKY_INGEST_TOKEN: ${{ secrets.OPENSKY_INGEST_TOKEN }}
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          AIRCRAFT_DB: aircraftDatabase.csv
        run: node scripts/opensky_collect.mjs
