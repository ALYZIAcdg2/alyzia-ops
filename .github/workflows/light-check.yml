name: Test liste allégée
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: |
          A=https://alyzia-ops.alyzia-cdg2.workers.dev
          for i in 1 2 3; do curl -sS --compressed -o lite.json -w "LISTE ALLÉGÉE ttfb=%{time_starttransfer}s total=%{time_total}s transfert=%{size_download}B\n" "$A/api/flights"; done
          curl -sS --compressed -o full.json -w "LISTE COMPLÈTE (full=1) ttfb=%{time_starttransfer}s total=%{time_total}s transfert=%{size_download}B\n" "$A/api/flights?full=1"
          node -e "
          const l=require('./lite.json'),f=require('./full.json');
          console.log('vols allégée',l.count,'complète',f.count,'| octets JSON',JSON.stringify(l).length,'vs',JSON.stringify(f).length);
          const withImp=l.flights.filter(x=>x.imports||x.flightInfoLog).length;console.log('vols encore porteurs de imports/flightInfoLog dans la liste allégée:',withImp);
          const fm=new Map(f.flights.map(x=>[x.date+'|'+x.airline+'|'+x.flight,x]));let diff=0,tot=0;
          for(const x of l.flights){const y=fm.get(x.date+'|'+x.airline+'|'+x.flight);if(!y)continue;tot++;const a=Object.assign({},y);delete a.imports;delete a.flightInfoLog;if(JSON.stringify(Object.keys(a).sort())!==JSON.stringify(Object.keys(x).sort()))diff++}
          console.log('vols comparés',tot,'avec clés différentes hors champs retirés:',diff);
          "
