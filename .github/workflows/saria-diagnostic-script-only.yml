name: Diagnostic SARIA - script JS uniquement (lecture seule, ponctuel)

# Complement au diagnostic precedent (saria-diagnostic-once.yml) : le job
# precedent imprimait front_index.html en entier (CSS + HTML + JS), ce qui
# rend le log CI trop long pour etre relu integralement par un outil qui ne
# peut recuperer que la queue (tail) du log. Ce job imprime uniquement le
# plus gros bloc <script>...</script> inline (celui qui contient la logique
# applicative SARIA), ce qui doit tenir dans la limite et permettre de lire
# la partie tete du JS (fonctions renderPlane / renderHorizontalFuselage /
# renderVerticalFuselage / le fallback generique quand zones/seats D1 sont
# vides).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  saria_script_only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FRONT: https://saria-cabin.pages.dev
    steps:
      - name: Extraire uniquement le plus gros bloc script du front SARIA
        run: |
          curl -sS -f "$FRONT/" -o front_index.html
          echo "----- TAILLE -----"; wc -c front_index.html; wc -l front_index.html
          echo "----- SCRIPT ONLY (sans CSS) -----"
          python3 - <<'PYEOF'
          import re
          html = open('front_index.html', 'r', encoding='utf-8', errors='replace').read()
          scripts = re.findall(r'<script\b[^>]*>(.*?)</script>', html, re.S | re.I)
          print(f"NB_SCRIPT_BLOCKS={len(scripts)}")
          for i, s in enumerate(scripts):
              print(f"===== SCRIPT BLOCK {i} LEN={len(s)} LINES={s.count(chr(10))+1} =====")
          if scripts:
              idx = max(range(len(scripts)), key=lambda i: len(scripts[i]))
              print(f"===== FULL CONTENT OF LARGEST SCRIPT BLOCK (index {idx}) =====")
              print(scripts[idx])
          PYEOF
