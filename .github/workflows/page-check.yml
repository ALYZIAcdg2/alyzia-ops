name: Test page fabriquée
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          A=https://alyzia-ops.alyzia-cdg2.workers.dev
          for i in 1 2 3; do curl -sS -H "Accept-Encoding: br" -o /dev/null -w "PAGE ttfb=%{time_starttransfer}s total=%{time_total}s transfert=%{size_download}B\n" $A/; done
          curl -sS -H "Accept-Encoding: br" -D h.txt -o /dev/null $A/; grep -iE "^(etag|cache-control|content-encoding|x-alyzia-page|cf-cache-status|last-modified)" h.txt
          E=$(grep -i "^etag" h.txt | head -1 | cut -d' ' -f2- | tr -d '\r')
          echo "etag=[$E]"
          if [ -n "$E" ]; then curl -sS -H "If-None-Match: $E" -o /dev/null -w "REVALIDATION -> %{http_code} ttfb=%{time_starttransfer}s transfert=%{size_download}B\n" $A/; fi
