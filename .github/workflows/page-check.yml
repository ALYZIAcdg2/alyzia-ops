name: Test page fabriquée
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          A=https://alyzia-ops.alyzia-cdg2.workers.dev
          for i in $(seq 1 12); do
            curl -sS -H "Accept-Encoding: br" -D h.txt -o /dev/null -w "ttfb=%{time_starttransfer}s total=%{time_total}s " "$A/?r=$i$RANDOM"
            RAY=$(grep -i "^cf-ray" h.txt | tr -d '\r' | awk '{print $2}')
            PG=$(grep -i "^x-alyzia-page" h.txt | tr -d '\r' | awk '{print $2}')
            FB=$(grep -i "^x-alyzia-bake-fallback" h.txt | tr -d '\r' | awk '{print $2}')
            echo "ray=$RAY page=[$PG] fallback=[$FB]"
            sleep 1
          done
