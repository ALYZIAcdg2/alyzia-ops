name: Test page fabriquée
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          A=https://alyzia-ops.alyzia-cdg2.workers.dev
          show() { echo "=== $1"; curl -sS -H "Accept-Encoding: br" -D - -o /dev/null -w "HTTP ttfb=%{time_starttransfer}s total=%{time_total}s taille=%{size_download}B\n" "$1" | grep -iE "^(HTTP|etag|cache-control|x-alyzia|cf-cache-status|age|content-length|content-type|last-modified|cf-ray)" | tr -d '\r'; }
          show "$A/"
          show "$A/?r=$RANDOM"
          show "$A/index.html"
          show "$A/baked-version"
          curl -sS "$A/baked-version" | head -c 60; echo
          show "$A/baked-index"
          show "$A/api/weather?iata=CDG"
